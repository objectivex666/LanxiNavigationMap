<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">
<title>兰溪铁路出行路线规划</title>
<!--🚇 -->
<style>
/* Hallmark · genre: modern-minimal · theme: cobalt · accent: electric cobalt oklch(58% 0.20 256)
 * macrostructure: Workbench × Map-Diagram · designed as an instrument panel, not a dashboard
 * fingerprint: hairline structure · dark graphite map = the hero · mono labels · one cobalt signal */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; }

:root {
  /* palette — cool engineered paper, hex fallback then OKLCH */
  --color-paper:    #f7f9fc;  --color-paper:    oklch(98.5% 0.004 250);
  --color-paper-2:  #f0f3f8;  --color-paper-2:  oklch(96.5% 0.008 250);
  --color-ink:      #1b2436;  --color-ink:      oklch(24% 0.02 258);
  --color-ink-2:    #3a4659;  --color-ink-2:    oklch(34% 0.018 257);
  --color-ink-3:    #7c8aa0;  --color-ink-3:    oklch(55% 0.02 256);
  --color-rule:     #e3e9f2;  --color-rule:     oklch(90% 0.012 252);
  --color-rule-2:   #cfd8e6;  --color-rule-2:   oklch(84% 0.02 252);
  --color-accent:   #2563eb;  --color-accent:   oklch(58% 0.20 256);
  --color-accent-ink: #ffffff;
  --color-accent-soft: #e8effc; --color-accent-soft: oklch(94% 0.03 256);
  --color-graphite: #141a26;  --color-graphite: oklch(22% 0.016 260);
  --color-graphite-2: #1d2534; --color-graphite-2: oklch(27% 0.02 260);
  --color-ok: #16a34a;
  --color-err: #dc2626;

  /* type */
  --font-display: 'Space Grotesk', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;

  /* 4pt space scale */
  --space-3xs: 0.125rem; --space-2xs: 0.25rem; --space-xs: 0.5rem;
  --space-sm: 0.75rem; --space-md: 1rem; --space-lg: 1.5rem;
  --space-xl: 2.5rem; --space-2xl: 4rem; --space-3xl: 6rem;

  /* z-scale */
  --z-base: 1; --z-raised: 10; --z-dropdown: 100; --z-sticky: 200;
  --z-modal: 400; --z-toast: 500; --z-tooltip: 600;

  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 10px;
}

body {
  background: var(--color-paper);
  color: var(--color-ink-2);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.app { max-width: 1240px; margin: 0 auto; padding: 0 var(--space-lg) var(--space-2xl); }

/* ---------- nav rail ---------- */
.nav {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: var(--space-lg); flex-wrap: wrap;
  padding: var(--space-md) 0;
  border-bottom: 1px solid var(--color-rule);
  background: color-mix(in srgb, var(--color-paper) 88%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  margin-bottom: var(--space-xl);
}
.brand { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
.brand .mark {
  width: 36px; height: 36px; flex-shrink: 0;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 600; font-size: 15px;
  color: var(--color-accent);
  border: 1px solid var(--color-rule-2); border-radius: 8px;
  background: var(--color-paper-2);
}
.brand h1 {
  font-family: var(--font-display); font-weight: 600; font-size: 18px;
  letter-spacing: 0.01em; line-height: 1.15; color: var(--color-ink);
  white-space: nowrap;
}
.brand .sub {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
  color: var(--color-ink-3); margin-top: 2px; text-transform: uppercase;
}
.nav .controls { margin-left: auto; display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }
.select-label {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--color-ink-3);
}
select {
  font: inherit; font-size: 13px; color: var(--color-ink);
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm);
  padding: 7px 10px; background: var(--color-paper); cursor: pointer;
  outline: none; max-width: 220px; min-width: 0;
  transition: border-color .15s;
}
select:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }

/* ---------- 路径 / URL 加载地图 ---------- */
.path-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.path-row input {
  font: inherit; font-size: 13px; color: var(--color-ink);
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm);
  padding: 7px 10px; background: var(--color-paper); outline: none;
  width: min(300px, 38vw); min-width: 120px;
  transition: border-color .15s, box-shadow .15s;
}
.path-row input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }

/* 确保 hidden 属性始终生效（避免被 .btn 等 display 规则覆盖） */
[hidden] { display: none !important; }

/* ---------- buttons ---------- */
.btn {
  font: inherit; font-size: 13px; font-weight: 500; color: var(--color-accent-ink);
  background: var(--color-accent); border: 1px solid var(--color-accent);
  border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap;
  transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
}
.btn:hover { background: oklch(55% 0.20 256); border-color: oklch(55% 0.20 256); }
.btn:active { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--color-ink-2); border-color: var(--color-rule-2); }
.btn.ghost:hover { color: var(--color-accent); border-color: var(--color-accent); background: transparent; }
.btn.plan { background: var(--color-accent); border-color: var(--color-accent); }
.btn.active-mode { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.kbd-btn { padding: 7px 10px; }
.kbd {
  font-family: var(--font-mono); font-size: 11px; line-height: 1;
  letter-spacing: 0.04em; color: var(--color-ink-3);
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-xs);
  padding: 3px 6px; background: var(--color-paper-2);
}

/* ---------- workbench: map = hero ---------- */
main {
  display: grid; grid-template-columns: minmax(0, 1fr) 336px;
  gap: var(--space-lg); align-items: start;
}
.map-card {
  position: relative;
  background: var(--color-graphite);
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-md);
  overflow: hidden;
  height: clamp(460px, 66vh, 700px);
}
.map-card canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
.map-name {
  position: absolute; top: 12px; left: 12px; z-index: var(--z-raised);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em;
  color: #cfe0f5; background: rgba(13, 17, 28, 0.82);
  border: 1px solid rgba(148, 178, 214, 0.2); border-radius: var(--radius-sm);
  padding: 6px 10px; pointer-events: none;
}
.map-hint {
  position: absolute; bottom: 10px; left: 12px; z-index: var(--z-raised);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.03em;
  color: rgba(200, 216, 236, 0.55); pointer-events: none;
}
/* ---------- 缩放控件 ---------- */
.zoom-controls {
  position: absolute; right: 12px; bottom: 12px; z-index: var(--z-raised);
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.zoom-controls .zoom-btn {
  width: 34px; height: 34px; border-radius: 9px;
  background: rgba(13, 17, 28, 0.82); color: #cfe0f5;
  border: 1px solid rgba(148, 178, 214, 0.22);
  font-family: var(--font-mono); font-size: 17px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  -webkit-user-select: none; user-select: none;
}
.zoom-controls .zoom-btn:hover { background: #1a2233; color: #fff; border-color: var(--color-accent); }
.zoom-controls .zoom-btn:active { transform: scale(0.94); }
.zoom-controls .zoom-val {
  font-family: var(--font-mono); font-size: 10px; color: rgba(200, 216, 236, 0.7);
  background: rgba(13, 17, 28, 0.7); border-radius: 6px; padding: 2px 7px;
  pointer-events: none;
}

/* ---------- right rail ---------- */
.rail { display: flex; flex-direction: column; gap: var(--space-xl); min-width: 0; }
.block > .kicker {
  display: flex; align-items: center; gap: var(--space-2xs);
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--color-ink-3); margin-bottom: var(--space-sm);
}
.block > .kicker::before { content: ''; width: 14px; height: 2px; background: var(--color-accent); }

/* ---------- planning inputs ---------- */
.input-wrap { position: relative; margin-bottom: var(--space-sm); }
.input-row { display: flex; align-items: center; gap: var(--space-xs); }
.dot {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: #fff;
}
.dot.from { background: var(--color-ok); }
.dot.to { background: var(--color-err); }
.input-row input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--color-ink);
  background: var(--color-paper); border: 1px solid var(--color-rule-2);
  border-radius: var(--radius-sm); padding: 9px 12px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input-row input:focus { border-color: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); background: #fff; }
.input-row input::placeholder { color: var(--color-ink-3); }
.icon-btn {
  width: 38px; height: 38px; flex-shrink: 0;
  border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm);
  background: transparent; color: var(--color-ink-3); font-size: 15px; cursor: pointer;
  display: grid; place-items: center;
  transition: color .12s, border-color .12s;
}
.icon-btn:hover { color: var(--color-accent); border-color: var(--color-accent); }
.dropdown {
  position: absolute; z-index: var(--z-dropdown); top: calc(100% + 4px); left: 30px; right: 0;
  background: #fff; border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm);
  box-shadow: 0 12px 30px oklch(20% 0.02 258 / 0.14);
  max-height: 220px; overflow-y: auto; display: none;
}
.dropdown.open { display: block; }
.dropdown .item {
  padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--color-ink-2);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.dropdown .item:hover, .dropdown .item.active { background: var(--color-accent-soft); }
.dropdown .item .chips { display: inline-flex; gap: 4px; flex-shrink: 0; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0, 0, 0, 0.1); }
.dropdown .empty { padding: 12px; color: var(--color-ink-3); font-size: 12px; }
.action-row { display: flex; gap: var(--space-xs); margin-top: var(--space-2xs); }
.action-row .btn { flex: 1; }

/* ---------- results: tabular spec ---------- */
.overview-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border: 1px solid var(--color-rule); border-radius: var(--radius-sm); overflow: hidden;
}
.ov-item { padding: var(--space-md) var(--space-xs); text-align: center; background: var(--color-paper-2); border-right: 1px solid var(--color-rule); }
.ov-item:last-child { border-right: none; }
.ov-item .v {
  font-family: var(--font-mono); font-size: 20px; font-weight: 600;
  color: var(--color-ink); line-height: 1.1; font-variant-numeric: tabular-nums;
}
.ov-item .v small { font-size: 11px; font-weight: 500; color: var(--color-ink-3); }
.ov-item .l {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--color-ink-3); margin-top: 4px;
}
.ov-item.time .v { color: var(--color-accent); }
.status {
  font-family: var(--font-mono); font-size: 12px; color: var(--color-ink-3);
  margin-top: var(--space-sm); min-height: 18px;
  display: flex; align-items: center; gap: 6px;
}

/* ---------- route detail ---------- */
#routeList { display: flex; flex-direction: column; gap: var(--space-sm); max-height: 360px; overflow-y: auto; padding-right: 2px; }
.empty-tip {
  color: var(--color-ink-3); font-size: 13px;
  border: 1px dashed var(--color-rule-2); border-radius: var(--radius-sm);
  padding: 14px 12px;
}
.seg { border: 1px solid var(--color-rule-2); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-paper); }
.seg .head {
  display: flex; align-items: center; gap: var(--space-xs);
  padding: 8px 12px; background: var(--color-paper-2); border-bottom: 1px solid var(--color-rule);
}
.line-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 600;
  color: #fff; border-radius: var(--radius-xs); padding: 2px 10px;
  white-space: nowrap; letter-spacing: 0.02em;
}
.seg .head .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-ink-3); margin-left: auto; white-space: nowrap; }
.seg .body { padding: 10px 12px; font-size: 14px; line-height: 1.9; word-break: break-all; color: var(--color-ink-2); }
.seg .body .s.hl { font-weight: 700; color: var(--color-ink); }
.seg .body .sep { color: var(--color-rule-2); margin: 0 4px; }
.transfer-note {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; color: #b45309; padding: 2px 4px;
}
.transfer-note .bar { flex: 1; height: 1px; background: var(--color-rule-2); }
.transfer-note b { color: #92400e; }

footer {
  display: flex; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap;
  margin-top: var(--space-2xl); padding-top: var(--space-md);
  border-top: 1px solid var(--color-rule);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--color-ink-3);
}

/* ---------- ⌘K command palette ---------- */
.palette-backdrop {
  position: fixed; inset: 0; z-index: var(--z-modal);
  background: oklch(20% 0.02 258 / 0.35);
  display: grid; place-items: start center; padding-top: 12vh;
}
.palette-backdrop[hidden] { display: none; }
.palette {
  width: min(520px, 92vw);
  background: #fff; border: 1px solid var(--color-rule-2); border-radius: var(--radius-md);
  box-shadow: 0 24px 60px oklch(20% 0.02 258 / 0.25);
  overflow: hidden;
}
.palette-search { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--color-rule); }
.palette-search input { flex: 1; min-width: 0; border: none; outline: none; font: inherit; font-size: 14px; color: var(--color-ink); background: transparent; }
.palette-list { max-height: 280px; overflow-y: auto; padding: 6px; }
.palette-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 13px; color: var(--color-ink-2);
}
.palette-item.active, .palette-item:hover { background: var(--color-accent-soft); }
.palette-empty { padding: 16px; font-family: var(--font-mono); font-size: 12px; color: var(--color-ink-3); }

/* ---------- reveal ---------- */
.reveal { opacity: 0; transform: translateY(10px); transition: opacity .6s cubic-bezier(0.16, 1, 0.3, 1), transform .6s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  * { scroll-behavior: auto !important; }
}

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  main { grid-template-columns: 1fr; }
  .map-card { height: clamp(400px, 56vh, 560px); }
  .nav .controls { margin-left: 0; width: 100%; }
  .palette-backdrop { padding-top: 8vh; }
}
@media (max-width: 560px) {
  .app { padding: 0 var(--space-md) var(--space-xl); }
  .brand h1 { font-size: 16px; }
  .map-card { height: clamp(340px, 50vh, 480px); }
  .map-hint { display: none; }
  .overview-grid { grid-template-columns: repeat(3, 1fr); }
}

</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand">
      <span class="mark">M</span>
      <div>
        <h1>兰溪铁路出行路线规划</h1>
        <div class="sub">模块化地图解析 · 换乘规划 · 耗时估算</div>
      </div>
    </div>
    <div class="controls">
      <label class="select-label" for="mapSelect" hidden>地图</label>
      <select id="mapSelect" hidden></select>
      <button class="btn ghost" id="importBtn" hidden>导入地图文件</button>
      <!-- 路径/URL 加载地图：当前隐藏，代码保留；需要时去掉 hidden 即可显示 -->
      <div class="path-row" hidden>
        <input type="text" id="mapPathInput" placeholder="地图路径 / URL（绝对路径、根相对路径、http(s)）" autocomplete="off" spellcheck="false">
        <button class="btn ghost kbd-btn" id="pathLoadBtn">加载</button>
      </div>
      <button class="btn ghost kbd-btn" id="paletteBtn" hidden title="命令面板（Ctrl/⌘ + K）"><span class="kbd">⌘K</span></button>
      <button class="btn ghost" id="resetBtn" hidden>重置</button>
    </div>
  </nav>

  <main>
    <section class="map-card">
      <div class="map-name" id="mapName">—</div>
      <div class="map-hint">滚轮/双指缩放 · 拖拽/单指平移 · 点击地图选站 · Enter 规划</div>
      <canvas id="map"></canvas>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomInBtn" title="放大 (+)" aria-label="放大">＋</button>
        <button class="zoom-btn" id="zoomOutBtn" title="缩小 (−)" aria-label="缩小">－</button>
        <button class="zoom-btn" id="zoomResetBtn" title="重置缩放 (0)" aria-label="重置缩放">⤢</button>
        <span class="zoom-val" id="zoomVal">100%</span>
      </div>
    </section>

    <aside class="rail">
      <section class="block reveal">
        <h2 class="kicker">出行规划</h2>
        <div class="input-wrap">
          <div class="input-row">
            <span class="dot from">A</span>
            <input id="fromInput" placeholder="起点站（输入或点击地图）" autocomplete="off">
          </div>
          <div class="dropdown" id="fromDropdown"></div>
        </div>
        <div class="input-wrap">
          <div class="input-row">
            <span class="dot to">B</span>
            <input id="toInput" placeholder="终点站（输入或点击地图）" autocomplete="off">
            <button class="icon-btn" id="swapBtn" title="交换起点与终点">⇅</button>
          </div>
          <div class="dropdown" id="toDropdown"></div>
        </div>
        <div class="action-row">
          <button class="btn plan" id="planBtn">规划路线</button>
          <button class="btn ghost" id="clearBtn">清空</button>
        </div>
        <div class="action-row">
          <button class="btn ghost" id="setStartBtn">选择起点</button>
          <button class="btn ghost" id="setEndBtn">选择终点</button>
        </div>
      </section>

      <section class="block reveal">
        <h2 class="kicker">出行结果</h2>
        <div class="overview-grid">
          <div class="ov-item time"><div class="v" id="timeVal">--<small> 分钟</small></div><div class="l">预计耗时</div></div>
          <div class="ov-item"><div class="v" id="stationVal">--</div><div class="l">途经站数</div></div>
          <div class="ov-item"><div class="v" id="transferVal">--</div><div class="l">换乘次数</div></div>
        </div>
        <div class="status" id="status">💡 输入或点击站点，开始规划</div>
      </section>

      <section class="block reveal">
        <h2 class="kicker">路线详情</h2>
        <div id="routeList"><div class="empty-tip">选择起点和终点后，点击「规划路线」</div></div>
      </section>
    </aside>
  </main>

  <!--<footer>
    <span>模块化地图解析 · Dijkstra 最短路径 + 换乘优化</span>
    <span>纯 HTML/JS · 任意浏览器运行</span>
  </footer>-->
</div>

<script>
/* ================================================================
 *  兰溪铁路出行路线规划 —— 模块化架构
 *  ----------------------------------------------------------------
 *  1) MapParser   : 解析任意符合格式的地图 JSON → 内部数据模型
 *  2) Graph/Path  : 构建含换乘代价的线路图，Dijkstra 求最优路径
 *  3) Renderer    : Canvas 绘制地图 / 高亮路线 / 悬停提示
 *  4) UI          : 搜索框、点选、按钮、结果渲染与交互
 *  5) MapRegistry : 内置示例地图 + 外部文件导入（可插拔）
 * ================================================================ */
(function () {
'use strict';

/* ================================================================
 *  0) 默认地图：启动时从根目录加载 intercitymap_ver20260807.json
 * ================================================================ */
const BUNDLED_MAPS = [];

/* ================================================================
 *  1) MapParser —— 解析地图 JSON → 数据模型
 *  ==============================================================
 *  输出模型:
 *  {
 *    name, meta: { stationTimeMin, transferTimeMin },
 *    lines:      { lineId: { id, name, color, routes:[[站名,...],...], travelMinutes:[] } },
 *    stations:   { name: { x, y, lines:[lineId] } },
 *    stationLines:{ name: [lineId] },
 *    stationOrder:[name], lineOrder:[lineId],
 *    segments:   [ { from, to, lineId, timeMin } ],
 *    graph:      Map<node, [{ to, t, type, lineId }]>   node = "站名\u0001线路id"
 *    bounds:     { minX, minY, maxX, maxY },
 *    hasCoords:  bool
 *  }
 * ================================================================ */
/* 无向邻接表 BFS 最短路径（供线路划分与路线高亮共用） */
function bfsShortestPath(adj, start, end) {
  if (start == null || end == null) return null;
  const prev = new Map([[start, null]]);
  const q = [start];
  while (q.length) {
    const cur = q.shift();
    if (cur === end) break;
    for (const nb of adj.get(cur) || []) {
      if (!prev.has(nb)) { prev.set(nb, cur); q.push(nb); }
    }
  }
  if (!prev.has(end)) return null;
  const path = [end];
  let c = end;
  while (prev.get(c)) { c = prev.get(c); path.unshift(c); }
  return path;
}
/* 无向节点对 -> 规范边键（a<b） */
function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

function parseMap(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('地图文件格式不正确（应为 JSON 对象）');

  // RailMapGen (RMP) 项目文件自动识别与转换
  if (raw.graph && Array.isArray(raw.graph.nodes) && Array.isArray(raw.graph.edges)) {
    raw = rmpToNative(raw);
  }

  if (!Array.isArray(raw.lines) || raw.lines.length === 0) {
    throw new Error('地图缺少 lines 数组（线路列表）');
  }

  const meta = {
    stationTimeMin: Number(raw.defaults && raw.defaults.stationTimeMin) || 2.5,
    transferTimeMin: Number(raw.defaults && raw.defaults.transferTimeMin) || 4,
  };

  const lines = {}, lineOrder = [];
  const stations = {}, stationLines = {}, stationOrder = [];

  // --- 线路（支持单路线 stations 或分支/环线 routes） ---
  for (const def of raw.lines) {
    const routes = Array.isArray(def.routes) && def.routes.length
      ? def.routes.filter(r => Array.isArray(r) && r.length).map(r => r.slice())
      : (Array.isArray(def.stations) && def.stations.length ? [def.stations.slice()] : []);
    if (!routes.length) continue;
    const id = String(def.id != null ? def.id : def.name);
    const name = def.name || (id + '号线');
    const color = def.color || defaultColor(id);
    const travelMinutes = Array.isArray(def.travelMinutes) ? def.travelMinutes : null;
    lines[id] = { id, name, color, routes, travelMinutes };
    lineOrder.push(id);
  }
  if (lineOrder.length === 0) throw new Error('地图没有有效线路');

  // --- 站点（从线路推导 + 合并坐标） ---
  const provided = (raw.stations && typeof raw.stations === 'object') ? raw.stations : {};
  let hasCoords = true;
  for (const lid of lineOrder) {
    for (const route of lines[lid].routes) for (const sname of route) {
      if (!stations[sname]) {
        stations[sname] = { x: null, y: null, lines: [] };
        stationOrder.push(sname);
        stationLines[sname] = [];
      }
      if (!stations[sname].lines.includes(lid)) stations[sname].lines.push(lid);
      if (!stationLines[sname].includes(lid)) stationLines[sname].push(lid);
    }
  }
  for (const sname of stationOrder) {
    const p = provided[sname];
    if (p && typeof p.x === 'number' && typeof p.y === 'number') {
      stations[sname].x = p.x; stations[sname].y = p.y;
      if (p.nx !== undefined) stations[sname].nx = p.nx;
      if (p.ny !== undefined) stations[sname].ny = p.ny;
    } else {
      hasCoords = false;
    }
  }

  // --- 布局：缺坐标时自动生成示意图 ---
  if (!hasCoords) autoLayout(stations, stationOrder, lineOrder, lines);

  // --- 区间（segments）---
  const segments = [];
  const overrides = {};
  if (Array.isArray(raw.segments)) {
    for (const s of raw.segments) {
      if (s && s.from && s.to) overrides[s.from + '\u0001' + s.to] = Number(s.timeMin) || meta.stationTimeMin;
    }
  }
  for (const lid of lineOrder) {
    const singleRoute = lines[lid].routes.length === 1;
    lines[lid].routes.forEach((route, ri) => {
      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i], b = route[i + 1];
        if (a === b) continue;
        let t = meta.stationTimeMin;
        if (singleRoute && lines[lid].travelMinutes && lines[lid].travelMinutes[i] != null) t = Number(lines[lid].travelMinutes[i]) || t;
        if (overrides[a + '\u0001' + b] != null) t = overrides[a + '\u0001' + b];
        if (overrides[b + '\u0001' + a] != null) t = overrides[b + '\u0001' + a];
        // RMP 地图默认双向（地铁双向运行）；有向效果由 applyMapAdapter 独立适配按需注入
        segments.push({ from: a, to: b, lineId: lid, timeMin: t });
      }
    });
  }

  // --- RMP lines.txt 方向注释：对应站名对设为单向（如 L1 科蓝东>原山>滨港） ---
  if (raw.rmpSource && raw.rmpGraph && Array.isArray(raw.rmpGraph.directedPairs) && raw.rmpGraph.directedPairs.length) {
    const dp = new Set(raw.rmpGraph.directedPairs.map(p => p[0] + '\u0001' + p[1]));
    for (let i = 0; i < segments.length; i++) {
      if (dp.has(segments[i].from + '\u0001' + segments[i].to)) {
        segments[i] = Object.assign({}, segments[i], { directed: true });
      }
    }
  }

  // --- 地图独立适配：应用层为特定地图注入特殊规则（不修改地图文件） ---
  applyMapAdapter(raw, segments, meta);

  // --- 未运营（灰色）区间：导航时排除（蓝色段不受影响） ---
  if (raw.rmpSource && raw.rmpGraph && Array.isArray(raw.rmpGraph.inactivePairs) && raw.rmpGraph.inactivePairs.length) {
    const inact = new Set(raw.rmpGraph.inactivePairs);
    const kept = segments.filter(s => {
      const k = s.from < s.to ? s.from + '\u0001' + s.to : s.to + '\u0001' + s.from;
      return !inact.has(k);
    });
    segments.length = 0;
    segments.push(...kept);
  }

  // --- 未运营站点：排除灰色后既无乘车边也无换乘连接（用于专门提示） ---
  const inactiveStations = [];
  if (raw.rmpSource && raw.rmpGraph) {
    const hasRide = new Set();
    for (const seg of segments) { hasRide.add(seg.from); hasRide.add(seg.to); }
    const hasEx = new Set();
    for (const pr of (raw.rmpGraph.exchanges || [])) { hasEx.add(pr[0]); hasEx.add(pr[1]); }
    for (const sname of stationOrder) {
      if (!hasRide.has(sname) && !hasEx.has(sname)) inactiveStations.push(sname);
    }
  }

  // --- 边界（RMP 地图额外包含虚拟节点与杂项组件坐标，避免边/徽标被裁切） ---
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const sname of stationOrder) {
    const s = stations[sname];
    minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x);
    minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y);
  }
  if (raw.rmpGraph) {
    for (const p of Object.values(raw.rmpGraph.nodes)) {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    }
    // 徽标/设施/文本常位于站点范围之外，纳入边界避免被裁出屏幕
    for (const mn of raw.rmpGraph.miscNodes || []) {
      minX = Math.min(minX, mn.x); maxX = Math.max(maxX, mn.x);
      minY = Math.min(minY, mn.y); maxY = Math.max(maxY, mn.y);
    }
  }

  return {
    name: raw.name || '未命名地图',
    meta, lines, stations, stationLines, stationOrder, lineOrder,
    segments, bounds: { minX, minY, maxX, maxY }, hasCoords,
    inactiveStations,
    rmpGraph: raw.rmpGraph || null,
  };
}

function defaultColor(id) {
  const palette = ['#2563eb', '#16a34a', '#dc2626', '#f59e0b', '#7c3aed', '#0891b2', '#db2777', '#65a30d', '#ea580c', '#4f46e5'];
  let h = 0;
  for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}

/* ================================================================
 *  RailMapGen (RMP) 项目文件解析器
 *  ----------------------------------------------------------------
 *  RMP 导出的 JSON 采用 graphology 图结构:
 *    { version, graph: { nodes:[{key, attributes}], edges:[{key, source, target, attributes}] } }
 *  解析策略:
 *    - 站点: key 以 "stn" 开头, attributes.type 为站点类型, [type].names 为多语言站名
 *    - 线路: 线段按颜色分组(颜色量化容差合并), 虚拟节点跳过, 追踪成有序站序列
 *    - 线路名: 优先从 *-line-badge 徽标节点提取(如 "2号线"), 否则按序号
 *    - 坐标: RMP 的 y 向下为正, 与画布一致, 直接使用
 * ================================================================ */

/* 线路覆盖定义（用户提供 lines.txt）：精确划分线路，替代徽标空间聚类。
 * 每行: 线路名 站1，站2，...（方向注释）
 * 方向注释如 （科蓝东>原山>滨港，滨港>科蓝东）→ 这些边对按单向运行 */
const RMP_LINES_OVERRIDE = `
L1 滨港，锦绣川（科蓝东>原山>滨港，滨港>科蓝东）
L2 闫千户，沿江,沿江东，西大街，东海岸，枫漓新村，枫漓新村南，河口
L2A 沿江，河口
L3 河口，新双桥
L5 枫漓新村，兰原东
城际L6线普通 沿江，新圳机场，青冶行，永安商务区，兰溪交通大学，北川原，兰原薛阳
城际L6线大站快车 沿江，青冶行，北川原，兰原薛阳
L7 江林机场，兰原薛阳
西原线 闫千户，海岸
江港线 常青港，江州北,江州
陈光快线 科蓝东，沿江，陈莹，康岭
机场磁浮联络 冰原机场，科蓝东，新圳机场
出闸换乘1 原山，陈莹
出闸换乘2 夏秋，康岭
`;

/* 解析 lines.txt 覆盖定义：返回 { defs（真实线路）, exchangeDefs（出闸换乘，不列入线路） } */
function parseLinesOverride(text) {
  const defs = [];
  const exchangeDefs = [];
  for (const line of String(text || '').split(/\r?\n/)) {
    const t = line.trim();
    if (!t) continue;
    const m = t.match(/^(\S+)\s+(.+)$/);
    if (!m) continue;
    const name = m[1];
    let rest = m[2];
    const directedPairs = [];
    const noteMatch = rest.match(/（(.+?)）/);
    if (noteMatch) {
      for (const seg of noteMatch[1].split(/[，,]/)) {
        const parts = seg.split('>').map(s => s.trim()).filter(Boolean);
        for (let i = 0; i < parts.length - 1; i++) directedPairs.push([parts[i], parts[i + 1]]);
      }
      rest = rest.replace(noteMatch[0], '');
    }
    const stations = rest.split(/[，,]/).map(s => s.trim()).filter(Boolean);
    if (stations.length < 2) continue;
    // 出闸换乘：不列入线路列表，仅作为换乘连接
    if (name.indexOf('出闸换乘') === 0) exchangeDefs.push({ name, stations, directedPairs });
    else defs.push({ name, stations, directedPairs });
  }
  return { defs, exchangeDefs };
}

/* 线路名映射到地图徽标标识（如 L1→城际L1线、L2B→城际L2A线、L6普通→城际L6线），找不到则用原名 */
function mapLineNameToBadge(name, badgeNames) {
  const m = name.match(/^L(\d+)([A-Za-z]?)$/);
  if (m) {
    const num = m[1], suffix = m[2] || '';
    if (suffix) {
      const t1 = '城际L' + num + suffix + '线';
      if (badgeNames.includes(t1)) return t1;
      const tA = '城际L' + num + 'A线';
      if (badgeNames.includes(tA)) return tA;
    }
    const t2 = '城际L' + num + '线';
    if (badgeNames.includes(t2)) return t2;
  }
  if (badgeNames.includes(name)) return name;
  // 机场磁浮联络 → 机场联络磁浮
  if (name.indexOf('机场磁浮') === 0) {
    const hit = badgeNames.find(b => b.indexOf('机场') >= 0 && b.indexOf('磁浮') >= 0);
    if (hit) return hit;
  }
  return name;
}

/* 用 lines.txt 精确划分线路：按站点顺序自动补全中间站（BFS），方向注释段标记单向。
 * 返回 { lines, edgeLine, directedPairs, exchanges }（edgeLine: 边 key -> lineId） */
function buildLinesFromOverride(raw, nodes, nameByKey, defs, exchangeDefs) {
  const nameToKey = new Map();
  nameByKey.forEach((v, k) => nameToKey.set(v, k));
  // 站名容错：精确匹配优先；别名/单字差异兜底（如 lines.txt 的「科蓝东」→ 地图「科蓝东」）
  const resolveKey = (nm) => {
    if (nameToKey.has(nm)) return nameToKey.get(nm);
    if (nm === '科蓝东') return nameToKey.get('科蓝东');
    for (const [k, v] of nameToKey) {
      if (v === nm) return k;
      if (Math.abs(v.length - nm.length) <= 1) {
        let same = 0;
        const set = new Set(v);
        for (const ch of nm) if (set.has(ch)) same++;
        if (same >= Math.max(v.length, nm.length) - 1) return k;
      }
    }
    return null;
  };
  // 节点级无向图 + 边 key 查找
  const adj = new Map();
  const edgeKeyByPair = new Map();
  for (const e of raw.graph.edges || []) {
    if (!e.key || e.source === e.target) continue;
    if (!adj.has(e.source)) adj.set(e.source, new Set());
    if (!adj.has(e.target)) adj.set(e.target, new Set());
    adj.get(e.source).add(e.target);
    adj.get(e.target).add(e.source);
    edgeKeyByPair.set(pairKey(e.source, e.target), e.key);
  }
  const edgeColor = new Map();
  for (const e of raw.graph.edges || []) {
    const hex = rmpEdgeColor(e.attributes || {});
    if (hex) edgeColor.set(e.key, hex);
  }

  const lines = [];
  const edgeLine = new Map();
  const directedPairs = [];
  let lineIdx = 0;
  for (const def of defs) {
    const lineEdges = [];
    const mainKeys = [];
    const extraRoutes = [];
    // 主序列：相邻站对 BFS 补全中间站，得到有序主路由
    for (let i = 0; i < def.stations.length - 1; i++) {
      const p = bfsShortestPath(adj, resolveKey(def.stations[i]), resolveKey(def.stations[i + 1]));
      if (!p) continue;
      for (let j = 0; j < p.length - 1; j++) {
        const eKey = edgeKeyByPair.get(pairKey(p[j], p[j + 1]));
        if (eKey && !edgeLine.has(eKey)) { edgeLine.set(eKey, 'rmp_' + lineIdx); lineEdges.push(eKey); }
      }
      for (const k of p) {
        const nm = nameByKey.get(k);
        if (nm && mainKeys[mainKeys.length - 1] !== nm) mainKeys.push(nm);
      }
    }
    // 方向注释：单向边对；每条注释路径生成独立子路由（如 科蓝东>原山>滨港）
    for (const [a, b] of def.directedPairs) {
      const p = bfsShortestPath(adj, resolveKey(a), resolveKey(b));
      if (!p) continue;
      const rk = [];
      for (let j = 0; j < p.length - 1; j++) {
        const k1 = p[j], k2 = p[j + 1];
        const eKey = edgeKeyByPair.get(pairKey(k1, k2));
        if (eKey) {
          if (!edgeLine.has(eKey)) { edgeLine.set(eKey, 'rmp_' + lineIdx); lineEdges.push(eKey); }
          const n1 = nameByKey.get(k1), n2 = nameByKey.get(k2);
          if (n1 && n2) directedPairs.push([n1, n2]);
        }
        for (const k of [k1, k2]) {
          const nm = nameByKey.get(k);
          if (nm && rk[rk.length - 1] !== nm) rk.push(nm);
        }
      }
      if (rk.length >= 2) extraRoutes.push(rk);
    }
    if (!lineEdges.length) { lineIdx++; continue; }
    // 线路颜色：边多数颜色
    let color = '#888888';
    const count = {};
    for (const ek of lineEdges) {
      const c = edgeColor.get(ek);
      if (c) count[c] = (count[c] || 0) + 1;
    }
    let bestN = 0;
    for (const [c, n] of Object.entries(count)) if (n > bestN) { bestN = n; color = c; }
    const routes = [];
    if (mainKeys.length >= 2) routes.push(mainKeys);
    for (const r of extraRoutes) routes.push(r);
    lines.push({
      id: 'rmp_' + lineIdx++,
      name: def.name,
      color,
      routes,
    });
  }
  // 出闸换乘：站名级换乘对（不列入线路，仅提供站间换乘）
  const exchanges = [];
  for (const def of exchangeDefs || []) {
    for (let i = 0; i < def.stations.length - 1; i++) {
      exchanges.push([def.stations[i], def.stations[i + 1]]);
    }
  }
  return { lines, edgeLine, directedPairs, exchanges };
}

function rmpToNative(raw) {
  const nodes = new Map(); // key -> attributes（含 type/x/y/visible 及类型专属属性如 names）
  for (const n of raw.graph.nodes || []) {
    nodes.set(n.key, n.attributes || {});
  }

  // ---- 站点名称（含无名站兜底、重名消歧） ----
  const nameByKey = new Map();
  const usedName = new Map();
  let unnamed = 0;
  for (const [key, node] of nodes) {
    if (!String(key).startsWith('stn') || !node.type) continue;
    const attr = node[node.type] || {};
    let names = Array.isArray(attr.names) ? attr.names.filter(s => s && String(s).trim()) : [];
    if (!names.length && Array.isArray(attr.secondaryNames)) {
      names = attr.secondaryNames.filter(s => s && String(s).trim());
    }
    let name = names.length ? String(names[0]).trim() : '';
    if (!name) name = '无名站' + (++unnamed);
    if (usedName.has(name) && usedName.get(name) !== key) name = name + '·' + (++unnamed);
    nameByKey.set(key, name);
    usedName.set(name, key);
  }

  // ---- 线路徽标 -> 线路名（记录位置，用于按徽标自动拆分同色线路） ----
  const badgeName = new Map(); // 量化颜色 -> 线路名（首个）
  const badges = [];           // 所有徽标 { name, q, x, y }
  for (const [key, node] of nodes) {
    if (!String(key).startsWith('misc_node') || !node.type || !String(node.type).includes('line-badge')) continue;
    const attr = node[node.type] || {};
    const q = Array.isArray(attr.color) ? (normColor(attr.color[2]) || attr.color[2]) : null;
    if (!q) continue;
    let nm = null;
    if (typeof attr.num === 'number') nm = attr.num + '号线';
    else if (typeof attr.num === 'string' && attr.num) nm = attr.num + '号线';
    else if (Array.isArray(attr.names)) {
      const zh = attr.names[0], en = attr.names[1];
      if (zh && String(zh).trim()) nm = String(zh).trim();
      else if (en && String(en).trim()) nm = String(en).trim();
    } else if (typeof attr.lineName === 'string' && attr.lineName.trim()) nm = attr.lineName.trim();
    else if (attr.lineName && typeof attr.lineName === 'object') {
      const vals = Object.values(attr.lineName).filter(v => typeof v === 'string' && v.trim());
      if (vals.length) nm = vals[0].trim();
    } else if (typeof attr.content === 'string' && attr.content.trim()) {
      nm = attr.content.trim();
    }
    if (nm) {
      badges.push({ name: nm, q, x: node.x, y: node.y });
      if (!badgeName.has(q)) badgeName.set(q, nm);
    }
  }

  // ---- 线段按颜色分组 ----
  const groups = new Map(); // 量化颜色 -> { color, count, edges:[] }
  for (const e of raw.graph.edges || []) {
    const a = e.attributes || {};
    if (a.visible === false) continue;
    if (!nodes.has(e.source) || !nodes.has(e.target) || e.source === e.target) continue;
    const hex = rmpEdgeColor(a);
    if (!hex) continue;
    const q = normColor(hex) || String(hex).toLowerCase();
    if (!groups.has(q)) groups.set(q, { color: hex, count: {}, edges: [] });
    const g = groups.get(q);
    g.edges.push({ key: e.key, source: e.source, target: e.target });
    g.count[hex] = (g.count[hex] || 0) + 1;
  }
  for (const g of groups.values()) {
    let best = null, bestN = -1;
    for (const [c, n] of Object.entries(g.count)) if (n > bestN) { bestN = n; best = c; }
    g.color = best;
  }

  // ---- 追踪路线：优先 lines.txt 精确划分线路，否则按徽标空间聚类 ----
  let lines = [];
  let edgeLine = new Map(); // 边 key -> 线路 id（用于标记边）
  let directedPairs = [];   // 站名级单向对（lines.txt 方向注释）
  let exchanges = [];       // 出闸换乘站对（不列入线路，仅换乘连接）
  const overrideParsed = parseLinesOverride(RMP_LINES_OVERRIDE);
  const overrideDefs = overrideParsed.defs;
  const exchangeDefs = overrideParsed.exchangeDefs;
  const mapStations = new Set([...nameByKey.values()]);
  let overlap = 0;
  for (const d of overrideDefs) for (const s of d.stations) if (mapStations.has(s)) overlap++;
  if (overrideDefs.length && overlap >= 6) {
    const r = buildLinesFromOverride(raw, nodes, nameByKey, overrideDefs, exchangeDefs);
    lines = r.lines;
    edgeLine = r.edgeLine;
    directedPairs = r.directedPairs;
    // 线路名映射到地图徽标标识（L1→城际L1线），并从数字 1 起保持 lines.txt 顺序
    const badgeNames = [...new Set(badges.map(b => b.name))];
    for (const l of lines) l.name = mapLineNameToBadge(l.name, badgeNames);
    exchanges = r.exchanges || [];
  } else {
    let lineIdx = 0;
  for (const [qcolor, g] of groups) {
    // 该色徽标（去重名字，保留位置）
    const qBadges = [];
    const seen = new Set();
    for (const b of badges) {
      if (b.q === qcolor && !seen.has(b.name)) { seen.add(b.name); qBadges.push(b); }
    }
    // 按边中点归属最近徽标，把同色边拆到不同徽标线路
    const subGroups = new Map(); // 徽标名 -> edges[]
    for (const e of g.edges) {
      if (qBadges.length) {
        const p1 = nodes.get(e.source), p2 = nodes.get(e.target);
        const mx = (((p1 && p1.x) || 0) + ((p2 && p2.x) || 0)) / 2;
        const my = (((p1 && p1.y) || 0) + ((p2 && p2.y) || 0)) / 2;
        let best = null, bd = Infinity;
        for (const b of qBadges) {
          const d = Math.hypot(mx - b.x, my - b.y);
          if (d < bd) { bd = d; best = b.name; }
        }
        if (!subGroups.has(best)) subGroups.set(best, []);
        subGroups.get(best).push(e);
      } else {
        if (!subGroups.has(null)) subGroups.set(null, []);
        subGroups.get(null).push(e);
      }
    }
    // 每组生成独立线路
    const groupList = [...subGroups];
    for (const [bname, edges] of groupList) {
      const adj = new Map();
      for (const e of edges) {
        if (!adj.has(e.source)) adj.set(e.source, new Set());
        if (!adj.has(e.target)) adj.set(e.target, new Set());
        adj.get(e.source).add(e.target);
        adj.get(e.target).add(e.source);
      }
      const allRoutes = [];
      const visited = new Set();
      for (const seed of adj.keys()) {
        if (visited.has(seed)) continue;
        const comp = [];
        const stack = [seed];
        visited.add(seed);
        while (stack.length) {
          const n = stack.pop();
          comp.push(n);
          for (const nb of adj.get(n) || []) {
            if (!visited.has(nb)) { visited.add(nb); stack.push(nb); }
          }
        }
        for (const routeKeys of traceRmpRoutes(adj, comp)) {
          const route = [];
          for (const k of routeKeys) {
            const nm = nameByKey.get(k);
            if (nm && route[route.length - 1] !== nm) route.push(nm);
          }
          if (route.length >= 2) allRoutes.push(route);
        }
      }
      if (allRoutes.length) {
        const lineId = 'rmp_' + lineIdx++;
        for (const e of edges) edgeLine.set(e.key, lineId);
        lines.push({
          id: lineId,
          name: bname || badgeName.get(qcolor) || ('线路' + lineIdx),
          color: g.color,
          routes: allRoutes,
        });
      }
    }
  }
  }
  if (!lines.length) {
    throw new Error('未能从 RailMapGen 文件中解析出有效线路（地图可能为空或仅含装饰元素）');
  }

  // ---- 站点坐标 ----
  const stations = {};
  for (const [key, node] of nodes) {
    if (!String(key).startsWith('stn')) continue;
    const nm = nameByKey.get(key);
    if (nm && typeof node.x === 'number' && typeof node.y === 'number') {
      const attr = node[node.type] || {};
      // 保存 RMP 站名偏移（用于标签定位，避免与徽标/组件重叠）
      stations[nm] = { x: node.x, y: node.y, nx: attr.nameOffsetX, ny: attr.nameOffsetY };
    }
  }

  // ---- 保留原始边数据（含路径类型/偏移/圆角/zIndex/线型），用于忠实渲染 ----
  const rmpNodes = {};
  const rmpEdges = [];
  for (const e of raw.graph.edges || []) {
    const a = e.attributes || {};
    if (a.visible === false) continue;
    if (!nodes.has(e.source) || !nodes.has(e.target)) continue;
    const hex = rmpEdgeColor(a);
    if (!hex) continue;
    const q = normColor(hex) || String(hex).toLowerCase();
    // 出闸/虚拟换乘边不属于任何线路（lineId 为空），仍须绘制（点虚线），单独标记为 virtual
    const style = a.style || 'single-color';
    const isVirtual = style === 'gzmtr-virtual-int' || style === 'shmetro-virtual-int';
    const lineId = edgeLine.get(e.key);
    if (lineId === undefined && !isVirtual) continue;
    const src = nodes.get(e.source), dst = nodes.get(e.target);
    if (typeof src.x === 'number' && typeof dst.x === 'number') {
      rmpNodes[e.source] = { x: src.x, y: src.y };
      rmpNodes[e.target] = { x: dst.x, y: dst.y };
    }
    rmpEdges.push({
      source: e.source, target: e.target,
      zIndex: a.zIndex ?? 0,
      pathType: a.type || 'simple',
      pathAttrs: a[a.type] || {},
      style,
      color: hex,
      lineId: lineId !== undefined ? lineId : 'virtual',
    });
  }

  // ---- 未运营（灰色）边：导航时应避开（#515151 量化后为 #505050，含虚拟换乘灰线） ----
  const inactivePairs = [];
  {
    const seenIn = new Set();
    for (const e of raw.graph.edges || []) {
      const a = e.attributes || {};
      const hex = rmpEdgeColor(a);
      if (!hex) continue;
      const q = normColor(hex);
      if (q !== '#505050') continue;
      const fn = nameByKey.get(e.source), tn = nameByKey.get(e.target);
      if (!fn || !tn || fn === tn) continue;
      const k = fn < tn ? fn + '\u0001' + tn : tn + '\u0001' + fn;
      if (!seenIn.has(k)) { seenIn.add(k); inactivePairs.push(k); }
    }
  }

  // ---- 收集杂项组件（文本/设施/线路徽标，虚拟节点等编辑辅助不渲染） ----
  const miscNodes = [];
  for (const [key, node] of nodes) {
    if (!String(key).startsWith('misc_node')) continue;
    if (node.visible === false || typeof node.x !== 'number' || typeof node.y !== 'number') continue;
    const type = node.type;
    if (!type) continue;
    if (type === 'virtual' || type === 'master' || type === 'fill' || type === 'image') continue;
    miscNodes.push({ key, type, x: node.x, y: node.y, zIndex: node.zIndex ?? 0, attr: node[type] || {} });
  }

  return {
    name: (raw.metadata && (raw.metadata.name || raw.metadata.title)) || 'RailMapGen 地图',
    defaults: { stationTimeMin: 2.5, transferTimeMin: 4 },
    stations, lines,
    rmpGraph: { nodes: rmpNodes, edges: rmpEdges, nameByKey: Object.fromEntries(nameByKey), miscNodes, directedPairs, exchanges, inactivePairs },
    rmpSource: true,
  };
}

/* RMP 线段取色：兼容所有线路样式
 *  1) 常规 color/colorA/colorB（单色/双色/北京地铁/港铁/新干线/城际等）
 *  2) generic 自定义样式：颜色在 layers[].color
 *  3) 无颜色属性的样式：使用 RMP 源码中的写死颜色
 *  4) 递归兜底：在属性中查找任意 Theme 数组 [城市, 线路, "#hex", 前景]
 */
function rmpEdgeColor(attrs) {
  if (!attrs || typeof attrs !== 'object') return null;
  const style = attrs.style;
  const sa = (style && attrs[style]) || attrs; // 兼容旧版顶层 color
  if (!sa || typeof sa !== 'object') return null;
  if (style === 'river') return null; // 河流等非交通装饰

  const pick = c => (Array.isArray(c) ? c[2] : (typeof c === 'string' && /^#/.test(c) ? c : null));

  // 1) 常规样式
  if (pick(sa.color)) return pick(sa.color);
  if (pick(sa.colorA)) return pick(sa.colorA);
  if (pick(sa.colorB)) return pick(sa.colorB);

  // 2) generic 自定义样式（多层叠加，取第一层颜色）
  if (Array.isArray(sa.layers)) {
    for (const layer of sa.layers) {
      if (layer && pick(layer.color)) return pick(layer.color);
    }
  }

  // 3) 无颜色属性的样式 —— RMP 组件中写死的颜色（互不相同，避免量化合并）
  if (style === 'china-railway') return '#000000';
  if (style === 'shanghai-suburban-railway') return '#898989';
  if (style === 'shmetro-virtual-int') return '#444444';
  if (style === 'gzmtr-virtual-int') return '#565656';
  if (style === 'unknown') return '#9ca3af';

  // 4) 递归兜底
  return rmpFindTheme(attrs);
}

/* 递归查找 Theme 数组 [城市码, 线路码, "#hex", 前景色] */
function rmpFindTheme(obj, depth) {
  if (!obj || typeof obj !== 'object' || (depth || 0) > 4) return null;
  if (Array.isArray(obj)) {
    if (obj.length === 4 && typeof obj[2] === 'string' && /^#[0-9a-fA-F]{6}$/.test(obj[2])) return obj[2];
    for (const v of obj) {
      const r = rmpFindTheme(v, (depth || 0) + 1);
      if (r) return r;
    }
    return null;
  }
  for (const v of Object.values(obj)) {
    const r = rmpFindTheme(v, (depth || 0) + 1);
    if (r) return r;
  }
  return null;
}

/* RMP 有向可达判断：在原始有向边中，能否从站点 fromName 沿边方向（可经虚拟节点透传）到达 toName */
function rmpCanReach(raw, fromName, toName) {
  const g = raw.rmpGraph || {};
  const nameByKey = g.nameByKey || {};
  let start = null, end = null;
  for (const [k, v] of Object.entries(nameByKey)) {
    if (v === fromName) start = k;
    if (v === toName) end = k;
  }
  if (!start || !end || start === end) return false;
  const adj = new Map();
  for (const e of g.edges || []) {
    if (!adj.has(e.source)) adj.set(e.source, []);
    adj.get(e.source).push(e.target);
  }
  const isVirtual = k => !String(k).startsWith('stn'); // 虚拟/杂项节点仅作中转
  const queue = [start];
  const seen = new Set([start]);
  while (queue.length) {
    const cur = queue.shift();
    for (const nxt of adj.get(cur) || []) {
      if (nxt === end) return true;
      if (!seen.has(nxt) && isVirtual(nxt)) { seen.add(nxt); queue.push(nxt); }
    }
  }
  return false;
}

/* 地图独立适配：针对特定地图应用特殊规则（不改地图文件，仅规划层注入虚拟区间）。
 * 当前适配：广东城际六站图（原山/滨港/科蓝东/望山塔/青冶行/锦绣川）——
 *   RMP 边为有向，需按原始有向边单向运行（滨港→原山 不可达、滨港仅可前往科蓝东）。 */
function applyMapAdapter(raw, segments, meta) {
  if (!raw.rmpSource || !segments.length) return;
  const names = new Set(Object.keys(raw.stations || {}));
  // 仅当恰好是六站小图时应用（避免误伤包含同名站点的更大地图）
  if (Object.keys(raw.stations || {}).length !== 6) return;
  const hit = ['原山', '滨港', '科蓝东', '望山塔', '青冶行', '锦绣川'].every(n => names.has(n));
  if (!hit) return;
  // 将双向区间按 RMP 原始有向边校正为单向（无反向边则不可回程）
  const out = [];
  for (const seg of segments) {
    const ab = rmpCanReach(raw, seg.from, seg.to);
    const ba = rmpCanReach(raw, seg.to, seg.from);
    if (ab && ba) out.push(seg);
    else if (ab) out.push({ ...seg, directed: true });
    else if (ba) out.push({ from: seg.to, to: seg.from, lineId: seg.lineId, timeMin: seg.timeMin, directed: true });
    // 双向均不可达：跳过
  }
  // 额外允许 望山塔→科蓝东 可达（用户要求；其余单向限制保留，如 滨港→原山 不可达）
  const lineId = (out[0] && out[0].lineId) || segments[0].lineId;
  if (!out.some(s => s.from === '望山塔' && s.to === '科蓝东' && s.lineId === lineId)) {
    out.push({ from: '望山塔', to: '科蓝东', lineId, timeMin: meta.stationTimeMin, directed: true });
  }
  segments.length = 0;
  segments.push(...out);
}

/* 颜色量化：容差合并 E3002B / E4002B 等细微色差；支持 3/6 位十六进制 */
function normColor(hex) {
  if (typeof hex !== 'string') return null;
  let h = hex.trim().toLowerCase();
  if (/^#?[0-9a-f]{3}$/.test(h)) h = '#' + h.replace(/^#/, '').split('').map(c => c + c).join('');
  if (!/^#[0-9a-f]{6}$/.test(h)) return null;
  const q = v => Math.round(v / 16) * 16;
  const r = q(parseInt(h.slice(1, 3), 16));
  const g = q(parseInt(h.slice(3, 5), 16));
  const b = q(parseInt(h.slice(5, 7), 16));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

/* 在连通分量内追踪站点路径（支持简单路径、环线与分支） */
function traceRmpRoutes(adj, comp) {
  const routes = [];
  const used = new Set();
  const degree = k => (adj.get(k) || new Set()).size;

  const walk = (from, to) => {
    const path = [from, to];
    used.add(pairKey(from, to));
    let prev = from, cur = to, guard = 0;
    while (guard++ < comp.length + 2) {
      const nexts = [...(adj.get(cur) || new Set())].filter(n => n !== prev);
      if (!nexts.length) break;
      const next = nexts[0];
      if (next === from) { path.push(from); break; } // 闭合环
      if (used.has(pairKey(cur, next))) break;
      used.add(pairKey(cur, next));
      path.push(next);
      if (degree(next) !== 2) break; // 到达端点/交叉点
      prev = cur; cur = next;
    }
    return path;
  };

  const junctions = comp.filter(k => degree(k) !== 2);
  if (junctions.length) {
    for (const v of junctions) {
      for (const u of adj.get(v) || []) {
        if (!used.has(pairKey(v, u))) routes.push(walk(v, u));
      }
    }
  } else {
    // 全为 2 度节点：环线
    for (const seed of comp) {
      for (const u of adj.get(seed) || []) {
        if (!used.has(pairKey(seed, u))) { routes.push(walk(seed, u)); break; }
      }
      if (routes.length) break;
    }
  }
  return routes;
}

/* 自动布局：按线路连通性分行，把每条线横向展开成示意图 */
function autoLayout(stations, stationOrder, lineOrder, lines) {
  // 线路邻接（共享站点）
  const adj = {};
  for (const lid of lineOrder) adj[lid] = new Set();
  for (const sname of stationOrder) {
    const ls = stations[sname].lines;
    for (let i = 0; i < ls.length; i++)
      for (let j = i + 1; j < ls.length; j++) {
        adj[ls[i]].add(ls[j]); adj[ls[j]].add(ls[i]);
      }
  }
  // BFS 分层 -> 行号
  const row = {};
  let next = 0;
  for (const seed of lineOrder) {
    if (row[seed] !== undefined) continue;
    row[seed] = next++;
    const q = [seed];
    while (q.length) {
      const cur = q.shift();
      for (const nb of adj[cur]) {
        if (row[nb] === undefined) { row[nb] = next++; q.push(nb); }
      }
    }
  }
  const stepX = 96, stepY = 130;
  const placed = {};
  const rowCount = {};
  for (const lid of lineOrder) {
    rowCount[row[lid]] = (rowCount[row[lid]] || 0) + 1;
  }
  const rowIdx = {};
  for (const lid of lineOrder) {
    const r = row[lid];
    rowIdx[lid] = rowIdx[lid] || 0;
    const offset = rowIdx[lid] * 26; rowIdx[lid]++;
    let idx = 0;
    for (const route of lines[lid].routes) {
      for (const sname of route) {
        if (placed[sname]) continue;
        const s = stations[sname];
        s.x = 60 + idx * stepX + offset;
        s.y = 60 + r * stepY;
        placed[sname] = true;
        idx++;
      }
    }
  }
}

/* ================================================================
 *  2) Graph + Path —— 含换乘代价的最短路径
 *  ================================================================ */
function buildGraph(model) {
  const graph = new Map();
  const node = (s, l) => s + '\u0001' + l;
  const addEdge = (a, b, t, type, lineId) => {
    if (!graph.has(a)) graph.set(a, []);
    graph.get(a).push({ to: b, t, type, lineId });
  };
  for (const seg of model.segments) {
    const a = node(seg.from, seg.lineId), b = node(seg.to, seg.lineId);
    addEdge(a, b, seg.timeMin, 'ride', seg.lineId);
    if (!seg.directed) addEdge(b, a, seg.timeMin, 'ride', seg.lineId);
  }
  for (const [sname, ls] of Object.entries(model.stationLines)) {
    if (ls.length < 2) continue;
    for (let i = 0; i < ls.length; i++)
      for (let j = i + 1; j < ls.length; j++) {
        const a = node(sname, ls[i]), b = node(sname, ls[j]);
        addEdge(a, b, model.meta.transferTimeMin, 'transfer', null);
        addEdge(b, a, model.meta.transferTimeMin, 'transfer', null);
      }
  }
  // 出闸换乘：站间虚拟换乘（不列入线路，仅允许在两站间换乘）
  const ex = model.rmpGraph && model.rmpGraph.exchanges;
  if (Array.isArray(ex)) {
    for (const [fa, fb] of ex) {
      const la = model.stationLines[fa] || [], lb = model.stationLines[fb] || [];
      for (const l1 of la) for (const l2 of lb) {
        if (l1 === l2) continue;
        const a = node(fa, l1), b = node(fb, l2);
        addEdge(a, b, model.meta.transferTimeMin, 'transfer', null);
        addEdge(b, a, model.meta.transferTimeMin, 'transfer', null);
      }
    }
  }
  model.graph = graph;
  return graph;
}

/* 返回 { segments:[{lineId, stations, time}], totalTime, totalStations, transfers } 或 null */
function findPath(model, start, end) {
  const node = (s, l) => s + '\u0001' + l;
  const startLines = model.stationLines[start] || [];
  const endLines = model.stationLines[end] || [];
  if (!startLines.length || !endLines.length) return null;
  if (start === end) {
    return { segments: [], totalTime: 0, totalStations: 0, transfers: 0, start, end, same: true };
  }

  const graph = model.graph;
  const dist = new Map(), prev = new Map(), pq = [];
  for (const l of startLines) {
    const n = node(start, l);
    dist.set(n, 0); prev.set(n, null);
    pq.push({ d: 0, n });
  }
  const endSet = new Set(endLines.map(l => node(end, l)));
  let best = null;

  while (pq.length) {
    pq.sort((a, b) => a.d - b.d);
    const { d, n } = pq.shift();
    if (d !== dist.get(n)) continue;
    if (endSet.has(n)) { best = n; break; }
    for (const e of graph.get(n) || []) {
      const nd = d + e.t;
      if (nd < (dist.get(e.to) === undefined ? Infinity : dist.get(e.to))) {
        dist.set(e.to, nd);
        prev.set(e.to, { from: n, edge: e });
        pq.push({ d: nd, n: e.to });
      }
    }
  }
  if (!best) return null;

  // 回溯节点路径
  const nodes = [];
  let cur = best;
  while (cur) { nodes.unshift(cur); cur = prev.get(cur) ? prev.get(cur).from : null; }

  // 切分为线路段
  const segments = [];
  let seg = null, totalTime = 0, totalStations = 0;
  for (let i = 0; i < nodes.length; i++) {
    const name = nodes[i].split('\u0001')[0], lineId = nodes[i].split('\u0001')[1];
    if (i === 0) {
      seg = { lineId, stations: [name], time: 0 };
    } else {
      const edge = prev.get(nodes[i]).edge;
      if (edge.type === 'ride' && edge.lineId === seg.lineId) {
        seg.stations.push(name); seg.time += edge.t; totalTime += edge.t; totalStations++;
      } else {
        if (seg.stations.length > 0) segments.push(seg);
        totalTime += edge.t; // 换乘耗时
        seg = { lineId, stations: [name], time: 0 };
      }
    }
  }
  if (seg && seg.stations.length) segments.push(seg);

  return {
    segments, totalTime: Math.round(totalTime), totalStations, transfers: segments.length - 1, start, end,
  };
}

/* ================================================================
 *  3) Renderer —— Canvas 绘制
 * ================================================================ */
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1, zoom: 1, panX: 0, panY: 0 };
let model = null, route = null, hover = null;
let highlightLines = new Set(); // 图例点击高亮的线路 id 集合
let legendItems = [];           // 图例可点击区域（屏幕坐标）

function fitTransform() {
  const b = model.bounds, pad = 52;
  const W = view.w, H = view.h;
  const bw = Math.max(b.maxX - b.minX, 1), bh = Math.max(b.maxY - b.minY, 1);
  const scale = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh);
  const ox = (W - bw * scale) / 2 - b.minX * scale;
  const oy = (H - bh * scale) / 2 - b.minY * scale;
  return { scale, ox, oy };
}
/* 有效变换 = 基础适配 × 用户缩放 + 平移 */
function currentTransform() {
  const t = fitTransform();
  return { scale: t.scale * view.zoom, ox: t.ox * view.zoom + view.panX, oy: t.oy * view.zoom + view.panY };
}
const toScreen = (p, t) => ({ x: p.x * t.scale + t.ox, y: p.y * t.scale + t.oy });
const toModel = (p, t) => ({ x: (p.x - t.ox) / t.scale, y: (p.y - t.oy) / t.scale });

/* ================================================================
 *  RMP 路径几何 —— 忠实还原 RailMapGen 的绘制
 *  ----------------------------------------------------------------
 *  对齐 RMP 源码:
 *    simple        : 直线（可垂直偏移 offset）
 *    perpendicular : 90° 折线（先垂直后水平，或反之，可圆角）
 *    diagonal      : 135° 折线（先水平/垂直后 45° 斜线，可圆角）
 *    roundCorner   : roundCornerFactor 为圆角绝对半径
 *  返回: { points:[[x,y]...], curve:{c1,c2,to}|null, end:[x,y]|null }
 * ================================================================ */
function rmpGeneratePath(x1, y1, x2, y2, type, attrs) {
  const a = attrs || {};
  switch (type) {
    case 'simple': return rmpSimplePath(x1, y1, x2, y2, a);
    case 'perpendicular': return rmpPerpendicularPath(x1, y1, x2, y2, a);
    case 'diagonal': return rmpDiagonalPath(x1, y1, x2, y2, a);
    default: return { points: [[x1, y1], [x2, y2]], curve: null, end: null };
  }
}
function rmpSimplePath(x1, y1, x2, y2, a) {
  const offset = a.offset ?? 0;
  const k = Math.abs((y2 - y1) / (x2 - x1));
  if (k === Infinity) return { points: [[x1 + offset, y1], [x2 + offset, y2]], curve: null, end: null };
  if (k === 0) return { points: [[x1, y1 + offset], [x2, y2 + offset]], curve: null, end: null };
  const kk = 1 / k;

  const hv = Math.abs(x2a - x1a) < Math.abs(y2a - y1a) ? 'vertical' : 'horizontal';

/* 圆角：按绝对半径将拐角替换为三次贝塞尔弧 */

/* 按 zIndex 排序绘制 RMP 原始边（还原线型/虚线/双色；支持图例高亮） */
function drawRmpLines(t) {
  const g = model.rmpGraph;
  const edges = [...g.edges].sort((a, b) => (a.zIndex ?? 0) - (b.zIndex ?? 0));
  const anyHighlight = highlightLines.size > 0;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const e of edges) {
    const p1 = g.nodes[e.source], p2 = g.nodes[e.target];
    if (!p1 || !p2) continue;
    const boosted = highlightLines.has(e.lineId);
    const dimmed = anyHighlight && !boosted;
    if (dimmed) ctx.globalAlpha = 0.18;
    if (boosted) { ctx.shadowColor = e.color; ctx.shadowBlur = 12; }
    const path = rmpGeneratePath(p1.x, p1.y, p2.x, p2.y, e.pathType, e.pathAttrs);
    const style = e.style || 'single-color';
    if (style === 'china-railway') {
      // 中国铁路：黑白虚线
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = boosted ? 7 : 5;
      ctx.setLineDash([10, 10]);
      rmpDrawPath(ctx, path, t);
      ctx.setLineDash([]);
    } else if (style === 'shanghai-suburban-railway') {
      // 市域铁路：灰外 + 白内 双层
      ctx.strokeStyle = '#898989';
      ctx.lineWidth = boosted ? 7 : 5;
      rmpDrawPath(ctx, path, t);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = boosted ? 3 : 2;
      rmpDrawPath(ctx, path, t);
    } else if (style === 'shmetro-virtual-int' || style === 'gzmtr-virtual-int') {
      // 虚拟换乘：点虚线
      ctx.strokeStyle = e.color;
      ctx.lineWidth = boosted ? 6 : 4;
      ctx.setLineDash([1, 6]);
      rmpDrawPath(ctx, path, t);
      ctx.setLineDash([]);
    } else if (style === 'dual-color') {
      // 双色线：主色宽线 + 辅色细线
      ctx.strokeStyle = e.color;
      ctx.lineWidth = boosted ? 7 : 5;
      rmpDrawPath(ctx, path, t);
      ctx.strokeStyle = '#ffffff';
      ctx.globalAlpha = dimmed ? 0.06 : 0.35;
      ctx.lineWidth = boosted ? 3 : 2;
      rmpDrawPath(ctx, path, t);
      ctx.globalAlpha = 1;
    } else if (String(style).includes('dotted')) {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = boosted ? 7 : 5;
      ctx.setLineDash([1, 8]);
      rmpDrawPath(ctx, path, t);
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = boosted ? 7 : 5;
      rmpDrawPath(ctx, path, t);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}
function rmpDrawPath(ctx, path, t) {
  const P = p => toScreen({ x: p[0], y: p[1] }, t);
  ctx.beginPath();
  const pts = path.points;
  ctx.moveTo(P(pts[0]).x, P(pts[0]).y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(P(pts[i]).x, P(pts[i]).y);
  if (path.curve) {
    ctx.bezierCurveTo(P(path.curve.c1).x, P(path.curve.c1).y, P(path.curve.c2).x, P(path.curve.c2).y, P(path.curve.to).x, P(path.curve.to).y);
    ctx.lineTo(P(path.end).x, P(path.end).y);
  }
  ctx.stroke();
}

function draw() {
  if (!model) return;
  const t = currentTransform();
  ctx.clearRect(0, 0, view.w, view.h);
  ctx.fillStyle = '#0f1420';
  ctx.fillRect(0, 0, view.w, view.h);

  // 线路：RMP 地图按原始边（路径类型/偏移/圆角/线型）忠实渲染；原生地图按站点折线
  if (model.rmpGraph && model.rmpGraph.edges.length) {
    drawRmpLines(t);
  } else {
    const anyHighlight = highlightLines.size > 0;
    for (const lid of model.lineOrder) {
      const line = model.lines[lid];
      const boosted = highlightLines.has(lid);
      const dimmed = anyHighlight && !boosted;
      if (dimmed) ctx.globalAlpha = 0.2;
      ctx.strokeStyle = line.color;
      ctx.lineWidth = boosted ? 7 : 5;
      if (boosted) { ctx.shadowColor = line.color; ctx.shadowBlur = 10; }
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const route of line.routes) {
        ctx.beginPath();
        let first = true;
        for (const sname of route) {
          const p = toScreen(model.stations[sname], t);
          if (first) { ctx.moveTo(p.x, p.y); first = false; }
          else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }
  }

  // 路线高亮
  if (route && route.segments.length) drawRouteGlow(t);

  // 站点
  for (const sname of model.stationOrder) drawStation(sname, t);

  // RMP 杂项组件（文本/设施/线路徽标）
  if (model.rmpGraph && model.rmpGraph.miscNodes && model.rmpGraph.miscNodes.length) {
    drawRmpMiscNodes(t);
  }

  // 图例
  drawLegend(t);

  // 悬停提示
  if (hover) drawTooltip(hover, t);
}

/* ================================================================
 *  RMP 杂项组件渲染：文本 / 设施图标 / 线路徽标
 * ================================================================ */
const RMP_FACILITY_EMOJI = [
  ['airport', '✈️'], ['railway', '🚉'], ['hsr', '🚄'], ['maglev', '🚝'],
  ['disney', '🎡'], ['tram', '🚋'], ['bus', '🚌'], ['coach', '🚌'],
  ['ferry', '⛴️'], ['cruise', '🚢'], ['shipping', '⛴️'], ['river', '⛵'],
  ['cable', '🚠'], ['intercity', '🚄'], ['sentosa', '🎢'], ['merlion', '🦁'],
  ['marina', '🏙️'], ['gardens', '🌳'], ['flyer', '🎡'], ['esplanade', '🎭'],
  ['tiananmen', '🏛️'], ['cable_car', '🚠'],
];
function rmpFacilityEmoji(type) {
  for (const [key, emoji] of RMP_FACILITY_EMOJI) {
    if (String(type).includes(key)) return emoji;
  }
  return '📍';
}

/* 提取 Theme 数组里的颜色 [城市, 线路, "#hex", 前景色] */
function rmpThemeColor(arr, idx) {
  if (Array.isArray(arr) && arr.length >= 4 && typeof arr[2] === 'string') return arr[idx || 2];
  return null;
}

function drawRmpMiscNodes(t) {
  // 尺寸用固定屏幕像素（与站点/站名标签一致，不随地图大小或用户缩放变化）
  const base = fitTransform().scale;
  // 按 zIndex 排序（RMP 中高 zIndex 在上层）；缓存避免每帧重新排序
  if (!drawRmpMiscNodes._cache || drawRmpMiscNodes._cache.model !== model) {
    drawRmpMiscNodes._cache = {
      model,
      list: [...model.rmpGraph.miscNodes].sort((a, b) => (a.zIndex ?? 0) - (b.zIndex ?? 0)),
    };
  }
  for (const n of drawRmpMiscNodes._cache.list) {
    if (String(n.type).includes('line-badge')) {
      drawRmpBadge(t, n);
    } else if (n.type === 'facilities') {
      drawRmpFacility(t, n);
    } else if (n.type === 'text' || n.type === 'i18n-text') {
      drawRmpTextNode(t, base, n);
    }
  }
}

/* 线路徽标：彩色标签 + 数字/名称（尺寸随缩放比例变化，100% 时保持可读） */
function drawRmpBadge(t, n) {
  const a = n.attr;
  const color = rmpThemeColor(a.color) || '#888888';
  const fg = Array.isArray(a.color) && a.color[3] ? a.color[3] : '#ffffff';
  const p = toScreen({ x: n.x, y: n.y }, t);
  // 基准 4px（100% 时小巧），随缩放放大但封顶 10px（与固定 12px 的站名协调，避免放大后徽标远超站名）
  const fs = Math.min(4 * view.zoom, 10);

  // 提取标题与副标题
  let title = null, sub = null;
  if (typeof a.num === 'number') title = String(a.num);
  else if (typeof a.num === 'string' && a.num) title = a.num;
  if (Array.isArray(a.names) && a.names.length) {
    const zh = a.names[0], en = a.names[1];
    if (title === null && zh && String(zh).trim()) title = String(zh).trim();
    if (en && String(en).trim()) sub = String(en).trim();
  }
  if (title === null) {
    if (typeof a.lineName === 'string' && a.lineName.trim()) title = a.lineName.trim();
    else if (a.lineName && typeof a.lineName === 'object') {
      const vals = Object.values(a.lineName).filter(v => typeof v === 'string' && v.trim());
      if (vals.length) title = vals[0].trim();
    } else if (typeof a.content === 'string' && a.content.trim()) title = a.content.trim();
  }
  if (title === null || title === '') return;

  ctx.save();
  ctx.font = `bold ${fs}px "PingFang SC","Segoe UI",sans-serif`;
  const titleW = ctx.measureText(title).width;
  const subFs = sub ? Math.max(fs * 0.55, 4) : 0;
  const subW = sub ? (() => { ctx.font = `bold ${subFs}px "PingFang SC","Segoe UI",sans-serif`; return ctx.measureText(sub).width; })() : 0;
  const w = Math.max(titleW, subW) + 6;
  const h = (sub ? fs + subFs + 2 : fs) + 4;

  // RMP 徽标以锚点为左上角、向右下延伸（避免居中偏移压到旁边组件）
  const x = p.x, y = p.y;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 2);
  ctx.fill();
  ctx.fillStyle = fg;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const padX = 3;
  if (sub) {
    ctx.font = `bold ${fs}px "PingFang SC","Segoe UI",sans-serif`;
    ctx.fillText(title, x + padX, y + fs / 2 + 2);
    ctx.font = `bold ${subFs}px "PingFang SC","Segoe UI",sans-serif`;
    ctx.fillText(sub, x + padX, y + fs + subFs / 2 + 2);
  } else {
    ctx.font = `bold ${fs}px "PingFang SC","Segoe UI",sans-serif`;
    ctx.fillText(title, x + padX, y + h / 2 + 0.5);
  }
  ctx.restore();
}

/* 设施：优先使用 RMP 原版 SVG 图标（机场等），其余用 emoji 近似 */
function drawRmpFacility(t, n) {
  const type = n.attr.type || '';
  if (type === 'airport_guangzhou' || type === 'airport') { drawRmpAirport(t, n); return; }
  const emoji = rmpFacilityEmoji(type);
  const p = toScreen({ x: n.x, y: n.y }, t);
  const fs = 12 * view.zoom;
  ctx.save();
  ctx.font = `${fs}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, p.x, p.y);
  ctx.restore();
}

/* RMP 机场图标：忠实复刻 railmapgen 的 SVG（airport_guangzhou = 蓝底圆角 + 白飞机）
 * RMP 原版为 25×25 地图单位、居中锚定于节点；此处用屏幕像素基准（随缩放放大但封顶）。 */
function drawRmpAirport(t, n) {
  const p = toScreen({ x: n.x, y: n.y }, t);
  // 尺寸：屏幕像素基准，随缩放放大但封顶（与站名/徽标协调）
  const s = Math.min(22 * view.zoom, 28);
  const k = s / 16.667; // viewBox 16.667 → 屏幕尺寸 s
  ctx.save();
  ctx.translate(p.x - s / 2, p.y - s / 2);
  ctx.scale(k, k);
  // 背景：圆角矩形 #00a4de（RMP 广州机场蓝）
  ctx.fillStyle = '#00a4de';
  ctx.beginPath();
  ctx.roundRect(0, 0, 16.667, 16.667, 1.25);
  ctx.fill();
  // 白色飞机（RMP SVG path，带原 translate(-41.667 -41.667)）
  ctx.translate(-41.667, -41.667);
  const plane = new Path2D('M52.6 55.625v.833l-2.6-.729-2.5.729v-.833l1.667-.833a2.2 2.2 0 0 1-.105-.834v-2.916l-5.625 1.375v-1.375l5.625-2.917V44.22a.974.974 0 0 1 .841-.986.94.94 0 0 1 1.035.932v3.959l5.625 2.917v1.375l-5.625-1.375v2.916a2.2 2.2 0 0 1-.105.834Z');
  ctx.fillStyle = '#ffffff';
  ctx.fill(plane);
  ctx.restore();
}

/* 文本 / 多语言文本节点 */
function drawRmpTextNode(t, base, n) {
  const a = n.attr;
  let content = a.content || '';
  if (n.type === 'i18n-text') {
    const contents = a.contents || {};
    content = contents['zh-Hans'] || contents['zh-Hant'] || contents.zh || contents.en || content || '';
  }
  content = String(content);
  if (!content.trim()) return;

  const fontSize = Number(a.fontSize) || 12;
  const lineHeight = Number(a.lineHeight) || fontSize;
  const textAnchor = ['start', 'middle', 'end'].includes(a.textAnchor) ? a.textAnchor : 'middle';
  const baseline = a.dominantBaseline || 'middle';
  const rotate = Number(a.rotate) || 0;
  const color = rmpThemeColor(a.color) || '#d7e3f4';
  const bold = a.bold === 'bold' || a.bold === 700 || a.bold === '700';
  const italic = a.italic === 'italic';
  const lines = String(content).split('\n');

  const p = toScreen({ x: n.x, y: n.y }, t);
  // 基准字号（含最小可读值），随缩放 view.zoom 同步放大
  const fsBase = Math.max(fontSize * base, 8);
  const fs = fsBase * view.zoom;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate((rotate * Math.PI) / 180);
  ctx.font = `${italic ? 'italic ' : ''}${bold ? 'bold ' : ''}${fs}px "PingFang SC","Segoe UI",sans-serif`;
  ctx.textAlign = textAnchor;
  ctx.textBaseline = baseline === 'hanging' ? 'top' : (baseline === 'auto' ? 'alphabetic' : 'middle');
  ctx.fillStyle = color;
  const lh = Math.max(lineHeight * base, fsBase) * view.zoom;
  const startY = baseline === 'hanging' ? 0 : (baseline === 'auto' ? 0 : -(lines.length - 1) * lh / 2);
  lines.forEach((line, i) => {
    ctx.fillText(line, 0, startY + i * lh);
  });
  ctx.restore();
}

function drawRouteGlow(t) {
  if (model.rmpGraph && model.rmpGraph.edges.length) {
    drawRmpRouteGlow(t);
    return;
  }
  ctx.save();
  ctx.shadowColor = 'rgba(250, 204, 21, 0.55)';
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let first = true;
  for (const seg of route.segments) {
    for (const sname of seg.stations) {
      const p = toScreen(model.stations[sname], t);
      if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.strokeStyle = '#fef3c7';
  ctx.lineWidth = 3;
  first = true;
  for (const seg of route.segments) {
    for (const sname of seg.stations) {
      const p = toScreen(model.stations[sname], t);
      if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
    }
  }
  ctx.stroke();
  ctx.restore();
}

/* RMP 地图的路线高亮：仅高亮路线真正经过的边（相邻站点间的实际路径，含虚拟节点） */
function drawRmpRouteGlow(t) {
  const g = model.rmpGraph;
  const hl = computeRmpHighlightEdges();
  const paint = (color, width, glow) => {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (glow) { ctx.shadowColor = 'rgba(250,204,21,0.55)'; ctx.shadowBlur = 16; }
    for (let i = 0; i < g.edges.length; i++) {
      if (!hl.has(i)) continue;
      const e = g.edges[i];
      const p1 = g.nodes[e.source], p2 = g.nodes[e.target];
      if (!p1 || !p2) continue;
      rmpDrawPath(ctx, rmpGeneratePath(p1.x, p1.y, p2.x, p2.y, e.pathType, e.pathAttrs), t);
    }
    ctx.restore();
  };
  paint('#facc15', 7, true);
  paint('#fef3c7', 3, false);
}

let hlCacheRoute = null, hlCacheEdges = null;
/* 计算需高亮的边集合：路线各分段中相邻站点之间的实际路径（经虚拟节点连通）
 * 结果按 route 引用缓存，避免每帧重算 BFS */
function computeRmpHighlightEdges() {
  if (hlCacheRoute === route && hlCacheEdges) return hlCacheEdges;
  const out = new Set();
  const g = model.rmpGraph;
  if (!g || !route) { hlCacheRoute = route; hlCacheEdges = out; return out; }

  // 按线路分组边，并建立该线路内的节点邻接（站与虚拟节点统一处理）
  const byLine = {};
  g.edges.forEach((e, idx) => {
    const info = byLine[e.lineId] || (byLine[e.lineId] = { adj: new Map(), list: [] });
    info.list.push({ e, idx });
    if (!info.adj.has(e.source)) info.adj.set(e.source, new Set());
    if (!info.adj.has(e.target)) info.adj.set(e.target, new Set());
    info.adj.get(e.source).add(e.target);
    info.adj.get(e.target).add(e.source);
  });

  // 站名 -> 节点 key（nameByKey 的反向映射）
  const keyByName = {};
  const nameByKey = g.nameByKey || {};
  for (const [k, nm] of Object.entries(nameByKey)) {
    if (nm && !(nm in keyByName)) keyByName[nm] = k;
  }

  // 在线路邻接中 BFS 找 A→B 的节点路径
  for (const seg of route.segments) {
    const info = byLine[seg.lineId];
    if (!info) continue;
    const sts = seg.stations;
    for (let i = 0; i < sts.length - 1; i++) {
      const sk = keyByName[sts[i]], ek = keyByName[sts[i + 1]];
      if (!sk || !ek) continue;
      const path = bfsShortestPath(info.adj, sk, ek);
      if (!path || path.length < 2) continue;
      for (let j = 0; j < path.length - 1; j++) {
        for (const { e, idx } of info.list) {
          if ((e.source === path[j] && e.target === path[j + 1]) || (e.source === path[j + 1] && e.target === path[j])) {
            out.add(idx);
          }
        }
      }
    }
  }
  hlCacheRoute = route;
  hlCacheEdges = out;
  return out;
}

function drawStation(sname, t) {
  const s = model.stations[sname];
  const p = toScreen(s, t);
  const isTransfer = s.lines.length > 1;
  const isStart = (sname === ui.start);
  const isEnd = (sname === ui.end);
  const inRoute = route && route.segments.some(seg => seg.stations.includes(sname));

  let r = isTransfer ? 13 : 9;
  if (isStart || isEnd) r = 15;
  if (hover === sname) r += 2;

  // 底色
  let fill = '#1b2436', stroke = '#3d4f6e', lw = 2;
  if (isStart) { fill = '#22c55e'; stroke = '#15803d'; lw = 3; }
  else if (isEnd) { fill = '#ef4444'; stroke = '#b91c1c'; lw = 3; }
  else if (inRoute) { fill = '#fef9c3'; stroke = '#eab308'; lw = 3; }
  else if (isTransfer) { fill = '#fef9e7'; stroke = '#f59e0b'; lw = 3; }

  if (inRoute && !isStart && !isEnd) {
    ctx.shadowColor = 'rgba(234,179,8,.45)'; ctx.shadowBlur = 14;
  }
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = lw;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 换乘内点
  if (isTransfer && !isStart && !isEnd) {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b'; ctx.fill();
  }
  if (isStart || isEnd) {
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(isStart ? 'A' : 'B', p.x, p.y + 0.5);
  }

  // 站名（尊重 RMP 的 nameOffsetX/nameOffsetY 定位，避免与徽标/组件重叠）
  const label = sname;
  const nx = s.nx, ny = s.ny;
  ctx.font = '12px "PingFang SC","Segoe UI",sans-serif';
  const tw = ctx.measureText(label).width + 12;
  const th = 20;
  const gap = 4; // 站名标签与站点的间距（RMP 中较紧凑）
  let lx, ly;
  if (nx === 'left') { lx = p.x - r - gap - tw; }
  else if (nx === 'right') { lx = p.x + r + gap; }
  else { lx = p.x - tw / 2; }
  if (ny === 'top') { ly = p.y - r - gap - th; }
  else if (ny === 'middle') { ly = p.y - th / 2; }
  else { ly = p.y + r + gap; } // bottom（默认）
  ctx.fillStyle = 'rgba(13,17,28,.92)';
  ctx.beginPath();
  ctx.roundRect(lx, ly, tw, th, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(148,178,214,.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = (isStart || isEnd || inRoute) ? '#f0f6ff' : '#c4d2e6';
  ctx.font = (isStart || isEnd) ? 'bold 12px "PingFang SC","Segoe UI",sans-serif' : '12px "PingFang SC","Segoe UI",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, lx + tw / 2, ly + th / 2);
}

function drawLegend(t) {
  const W = view.w;
  let x = W - 16, y = 14;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '11px "PingFang SC","Segoe UI",sans-serif';
  legendItems = [];
  for (let i = 0; i < model.lineOrder.length; i++) {
    const lid = model.lineOrder[i];
    const line = model.lines[lid];
    const w = ctx.measureText(line.name).width + 22;
    if (x - w < 16) break;
    const sel = highlightLines.has(lid);
    ctx.fillStyle = sel ? 'rgba(20,28,44,.96)' : 'rgba(13,17,28,.92)';
    ctx.beginPath(); ctx.roundRect(x - w, y, w, 16, 8); ctx.fill();
    if (sel) {
      ctx.strokeStyle = line.color; ctx.lineWidth = 1.5;
    } else {
      ctx.strokeStyle = 'rgba(148,178,214,.25)'; ctx.lineWidth = 1;
    }
    ctx.stroke();
    ctx.fillStyle = line.color;
    ctx.fillRect(x - w + 6, y + 6.5, 10, 3);
    ctx.fillStyle = sel ? '#eaf2ff' : '#9fb2cc';
    ctx.fillText(line.name, x - 8, y + 8);
    if (sel) {
      // 选中指示点
      ctx.fillStyle = line.color;
      ctx.beginPath(); ctx.arc(x - w + 2, y + 8, 2.5, 0, Math.PI * 2); ctx.fill();
    }
    legendItems.push({ lineId: lid, x: x - w, y, w, h: 16 });
    y += 20;
  }
}

function drawTooltip(sname, t) {
  const s = model.stations[sname];
  const p = toScreen(s, t);
  const lines = s.lines.map(lid => model.lines[lid]);
  let text = sname;
  const lineNames = lines.map(l => l.name).join(' · ');
  ctx.font = '12px "PingFang SC","Segoe UI",sans-serif';
  const w1 = ctx.measureText(text).width;
  ctx.font = '11px "PingFang SC","Segoe UI",sans-serif';
  const w2 = ctx.measureText(lineNames).width;
  const w = Math.max(w1, w2) + 24;
  const h = 40;
  let x = p.x - w / 2, y = p.y - 15 - h - 10;
  x = Math.max(8, Math.min(view.w - w - 8, x));
  y = Math.max(8, y);
  ctx.fillStyle = 'rgba(15,23,42,.92)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "PingFang SC","Segoe UI",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x + 12, y + 13);
  ctx.font = '11px "PingFang SC","Segoe UI",sans-serif';
  ctx.fillStyle = '#d1d9e6';
  ctx.fillText(lineNames, x + 12, y + 29);
}

/* roundRect polyfill */
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y); this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r); this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h); this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r); this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
    return this;
  };
}

function loadMap(raw) {
  try {
    model = parseMap(raw);
  } catch (e) {

  }
  buildGraph(model);
