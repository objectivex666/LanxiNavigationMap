}

/* 默认地图路径：默认相对页面目录；也可改为完整磁盘路径 / 根相对路径 / URL
 * 例：'E:/迅雷下载/LanxiNavigationMap/intercitymap_ver20260807.json'、'/maps/a.json'、'https://…' */
const DEFAULT_MAP_PATH = 'intercitymap_ver20260807.json';

/* 把用户输入的路径解析为可 fetch 的 URL：
 * - http/https → 原样
 * - Windows 绝对路径（E:\… 或 E:/…）→ file:///E:/…
 * - UNC（\\server\share）→ file://server/share
 * - 其余（/根相对、相对路径）→ 相对页面解析 */
function resolveMapUrl(p) {
  p = (p || '').trim();
  if (!p) return null;
  if (/^https?:\/\//i.test(p)) return p;
  if (/^[a-zA-Z]:[\\/]/.test(p)) return 'file:///' + p.replace(/\\/g, '/');
  if (p.startsWith('\\\\')) return 'file://' + p.replace(/\\/g, '/');
  return p;
}

/* 通过路径/URL 加载地图（支持根文件路径、根相对路径、http(s) 链接） */
async function loadMapFromPath(p) {
  const url = resolveMapUrl(p);
  if (!url) { setStatus('⚠️ 请输入地图文件路径或 URL', '#d97706'); return; }
  try {
    setStatus('⏳ 正在加载：' + p + ' …', '#2563eb');
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = JSON.parse(await res.text());
    if (!loadMap(raw)) return;
    // 追加到下拉，方便切换回默认地图
    const opt = document.createElement('option');
    opt.value = 'custom';
    opt.textContent = (raw.name || p) + '（路径加载）';
    els.mapSelect.appendChild(opt);
    els.mapSelect.value = 'custom';
  } catch (err) {
    // file:// 协议下浏览器会拦截 fetch 本地文件（CORS），给出可操作的提示
    const isFilePage = location.protocol === 'file:';
    const hint = isFilePage
      ? '浏览器禁止 file:// 页面读取本地文件，请改用「导入地图文件」选择器，或通过本地服务器访问'
      : '请检查路径/URL 是否正确';
    setStatus('❌ 无法加载「' + p + '」：' + err.message + '（' + hint + '）', '#dc2626');
  }
}

els.pathLoadBtn.addEventListener('click', () => loadMapFromPath(els.mapPathInput.value));
els.mapPathInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); loadMapFromPath(els.mapPathInput.value); }
});

/* 读取内嵌地图数据（file:// 直开时 fetch 被浏览器拦截，回退用内嵌副本） */
function readEmbeddedMap() {
  const el = document.getElementById('embedded-map');
  if (!el) return null;
  const t = (el.textContent || '').trim();
  if (!t) return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

async function populateMapSelect() {
  els.mapSelect.innerHTML = '';
  let raw = null;
  // 1) 优先尝试 fetch（本地服务 / 允许 file 协议的环境可获取磁盘上的最新文件）
  try {
    const res = await fetch(resolveMapUrl(DEFAULT_MAP_PATH) || DEFAULT_MAP_PATH);
    if (res.ok) raw = JSON.parse(await res.text());
  } catch (err) { /* 忽略：Edge/Chrome 的 file:// 会拦截 fetch，转入内嵌回退 */ }
  // 2) fetch 失败 → 使用内嵌地图副本（保证任何浏览器直接打开都能加载）
  if (!raw) raw = readEmbeddedMap();
  if (raw && loadMap(raw)) {
    const opt = document.createElement('option');
    opt.value = '__default__';
    opt.textContent = raw.name || DEFAULT_MAP_PATH;
    els.mapSelect.appendChild(opt);
    els.mapSelect.value = '__default__';
    setStatus('✅ 已加载默认地图「' + (raw.name || '城际地图') + '」', '#16a34a');
    return;
  }
  setStatus('⚠️ 未能自动加载默认地图，请使用上方路径输入框或「导入地图文件」手动加载', '#d97706');
}

els.mapSelect.addEventListener('change', async () => {
  if (els.mapSelect.value === '__default__') {
    let raw = null;
    try {
      const res = await fetch(resolveMapUrl(DEFAULT_MAP_PATH) || DEFAULT_MAP_PATH);
      if (res.ok) raw = JSON.parse(await res.text());
    } catch (err) { /* 忽略：file:// 下回退内嵌 */ }
    if (!raw) raw = readEmbeddedMap();
    if (raw) loadMap(raw);
    return;
  }
  const i = Number(els.mapSelect.value);
  if (BUNDLED_MAPS[i]) loadMap(BUNDLED_MAPS[i]);
});
els.importBtn.addEventListener('click', () => els.fileInput.click());
els.fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const raw = JSON.parse(reader.result);
      if (loadMap(raw)) {
        // 追加到下拉，方便切换
        const opt = document.createElement('option');
        opt.value = 'custom';
        opt.textContent = (raw.name || file.name) + '（导入）';
        els.mapSelect.appendChild(opt);
        els.mapSelect.value = 'custom';
      }
    } catch (err) {
      setStatus('❌ 解析 JSON 失败：' + err.message, '#dc2626');
    }
  };
  reader.readAsText(file);
  els.fileInput.value = '';
});

/* ---------- 搜索下拉 ---------- */
function renderDropdown(listEl, stations, query, onPick) {
  listEl.innerHTML = '';
  const q = (query || '').trim();
  const filtered = stations.filter(s => !q || s.includes(q));
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">无匹配站点</div>';
    return;
  }
  filtered.slice(0, 40).forEach((sname, idx) => {
    const item = document.createElement('div');
    item.className = 'item' + (idx === 0 ? ' active' : '');
    const chips = model.stationLines[sname].map(lid =>
      '<span class="chip" style="background:' + model.lines[lid].color + '"></span>').join('');
    item.innerHTML = '<span>' + sname + '</span><span class="chips">' + chips + '</span>';
    item.addEventListener('mousedown', (ev) => { ev.preventDefault(); onPick(sname); });
    item.addEventListener('mouseenter', () => {
      listEl.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
      item.classList.add('active');
    });
    listEl.appendChild(item);
  });
  listEl._items = filtered.slice(0, 40);
  listEl._onPick = onPick;
}

function setupSearch(inputEl, listEl, kind) {
  const show = () => {
    if (!model) return;
    renderDropdown(listEl, model.stationOrder, inputEl.value, (sname) => {
      pick(kind, sname);
      hideDropdown(listEl);
    });
    listEl.classList.add('open');
  };
  inputEl.addEventListener('focus', show);
  inputEl.addEventListener('input', show);
  inputEl.addEventListener('blur', () => setTimeout(() => hideDropdown(listEl), 140));
  inputEl.addEventListener('keydown', (e) => {
    const items = listEl._items || [];
    const active = listEl.querySelector('.item.active');
    const idx = items.indexOf(active && active._sname);
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = items[(idx + 1) % items.length];
      highlight(listEl, next);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const next = items[(idx - 1 + items.length) % items.length];
      highlight(listEl, next);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active && active._sname) { pick(kind, active._sname); hideDropdown(listEl); }
      else if (items[0]) { pick(kind, items[0]); hideDropdown(listEl); }
    } else if (e.key === 'Escape') {
      hideDropdown(listEl);
    }
  });
  // 记住站名用于高亮
  listEl.addEventListener('click', () => {});
  const origRender = listEl.innerHTML;
  void origRender;
  // 给 item 附加站名（在上面的 renderDropdown 里赋值）
}
function highlight(listEl, sname) {
  listEl.querySelectorAll('.item').forEach(el => {
    const on = el.querySelector('span') && el.textContent.startsWith(sname);
    el.classList.toggle('active', el.textContent.trim().startsWith(sname));
  });
}
function hideDropdown(listEl) { listEl.classList.remove('open'); }

function pick(kind, sname) {
  if (kind === 'start') {
    if (sname === ui.end) { setStatus('⚠️ 起点与终点不能相同', '#d97706'); return; }
    ui.start = sname; els.fromInput.value = sname;
  } else {
    if (sname === ui.start) { setStatus('⚠️ 终点与起点不能相同', '#d97706'); return; }
    ui.end = sname; els.toInput.value = sname;
  }
  draw();
  if (ui.start && ui.end) planRoute();
  else setStatus('💡 已选「' + sname + '」为' + (kind === 'start' ? '起点' : '终点') + '，请继续选择');
}

/* ---------- 规划 ---------- */
function planRoute() {
  if (!ui.start || !ui.end) { setStatus('⚠️ 请先选择起点和终点', '#d97706'); return; }
  if (ui.start === ui.end) {
    setStatus('⚠️ 起点与终点相同，无需规划', '#d97706');
    route = null; renderResult(null); draw();
    return;
  }
  const result = findPath(model, ui.start, ui.end);
  if (!result) {
    const inSt = model.inactiveStations || [];
    const sOn = inSt.indexOf(ui.start) >= 0, eOn = inSt.indexOf(ui.end) >= 0;
    if (sOn && eOn) setStatus('❌ 起点与终点均位于未运营线路，暂无法乘车', '#dc2626');
    else if (sOn) setStatus('❌ 起点位于未运营线路，暂无法乘车', '#dc2626');
    else if (eOn) setStatus('❌ 终点位于未运营线路，暂无法到达', '#dc2626');
    else setStatus('❌ 无法找到路线（两站可能不连通）', '#dc2626');
    route = null; renderResult(null); draw();
    return;
  }
  route = result;
  renderResult(result);
  draw();
  setStatus(SHOW_TIME ? ('✅ 已找到路线 · 约 ' + result.totalTime + ' 分钟') : '✅ 已找到路线', '#16a34a');
}

function renderResult(result) {
  if (!result) {
    if (SHOW_TIME) els.timeVal.innerHTML = '--<small> 分钟</small>';
    els.stationVal.textContent = '--';
    els.transferVal.textContent = '--';
    els.routeList.innerHTML = '<div class="empty-tip">选择起点和终点后，点击「规划路线」</div>';
    return;
  }
  if (SHOW_TIME) els.timeVal.innerHTML = result.totalTime + '<small> 分钟</small>';
  els.stationVal.textContent = result.totalStations;
  els.transferVal.textContent = result.transfers;

  if (result.same) {
    els.routeList.innerHTML = '<div class="empty-tip">📍 起点即终点，已到达</div>';
    return;
  }

  let html = '';
  result.segments.forEach((seg, i) => {
    const line = model.lines[seg.lineId];
    const sts = seg.stations;
    const body = sts.map((s, j) =>
      '<span class="s' + ((j === 0 || j === sts.length - 1) ? ' hl' : '') + '">' + s + '</span>' +
      (j < sts.length - 1 ? '<span class="sep">→</span>' : '')
    ).join('');
    html += '<div class="seg">' +
      '<div class="head"><span class="line-pill" style="background:' + line.color + '">' + line.name + '</span>' +
      '<span class="meta">' + seg.stations.length + ' 站' + (SHOW_TIME ? ' · 约 ' + Math.round(seg.time) + ' 分钟' : '') + '</span></div>' +
      '<div class="body">' + body + '</div></div>';
    if (i < result.segments.length - 1) {
      const via = seg.stations[seg.stations.length - 1];
      const nextLine = model.lines[result.segments[i + 1].lineId];
      html += '<div class="transfer-note"><span>🔄</span>在 <b>' + via + '</b> 换乘 <b>' + nextLine.name + '</b><span class="bar"></span></div>';
    }
  });
  els.routeList.innerHTML = html;
}

/* ---------- 地图缩放 / 平移 / 点选 ---------- */
function canvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function clampZoom(z) { return Math.min(10, Math.max(1, z)); }
function setZoomUI() {
  const el = document.getElementById('zoomVal');
  if (el) el.textContent = Math.round(view.zoom * 100) + '%';
}
/* 以屏幕点 (sx,sy) 为锚点缩放 factor 倍（锚点下的地图内容保持不动） */
function zoomAt(sx, sy, factor) {
  const newZoom = clampZoom(view.zoom * factor);
  const realFactor = newZoom / view.zoom;
  view.panX = sx - (sx - view.panX) * realFactor;
  view.panY = sy - (sy - view.panY) * realFactor;
  view.zoom = newZoom;
  draw();
  setZoomUI();
}
function zoomCenter(factor) {
  zoomAt(view.w / 2, view.h / 2, factor);
}
function resetZoom() {
  view.zoom = 1; view.panX = 0; view.panY = 0;
  draw();
  setZoomUI();
}

/* 滚轮缩放（以光标为中心） */
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (!model) return;
  const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
  zoomAt(canvasPoint(e).x, canvasPoint(e).y, factor);
}, { passive: false });

/* 拖拽平移 + 点击选择（拖拽后抑制点击） */
let dragState = null;
let suppressClick = false;
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragState = { sx: e.clientX, sy: e.clientY, px: view.panX, py: view.panY, moved: false };
});
canvas.addEventListener('mousemove', (e) => {
  if (!model) return;
  if (dragState) {
    const dx = e.clientX - dragState.sx, dy = e.clientY - dragState.sy;
    if (!dragState.moved && Math.hypot(dx, dy) > 4) dragState.moved = true;
    if (dragState.moved) {
      view.panX = dragState.px + dx;
      view.panY = dragState.py + dy;
      draw();
    }
    return;
  }
  const t = currentTransform();
  const m = toModel(canvasPoint(e), t);
  const threshold = 26 / t.scale;
  let best = null, bd = Infinity;
  for (const sname of model.stationOrder) {
    const s = model.stations[sname];
    const d = Math.hypot(m.x - s.x, m.y - s.y);
    if (d < threshold && d < bd) { bd = d; best = sname; }
  }
  if (best !== hover) { hover = best; canvas.style.cursor = best ? 'pointer' : 'default'; draw(); }
});
document.addEventListener('mouseup', () => {
  if (dragState && dragState.moved) suppressClick = true;
  dragState = null;
});
canvas.addEventListener('mouseleave', () => {
  dragState = null;
  if (hover !== null) { hover = null; draw(); }
});

/* 触屏：单指平移 + 双指捏合缩放 */
let touchState = null;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchState = { mode: 'pan', sx: e.touches[0].clientX, sy: e.touches[0].clientY, px: view.panX, py: view.panY };
  } else if (e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    touchState = {
      mode: 'pinch', zoom: view.zoom, px: view.panX, py: view.panY,
      dist: Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY),
    };
  }
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (!touchState || !model) return;
  e.preventDefault();
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    view.panX = touchState.px + (t.clientX - touchState.sx);
    view.panY = touchState.py + (t.clientY - touchState.sy);
    draw();
  } else if (touchState.mode === 'pinch' && e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const p = canvasPoint(t0);
    const q = canvasPoint(t1);
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const factor = dist / Math.max(touchState.dist, 1);
    const newZoom = clampZoom(touchState.zoom * factor);
    const realFactor = newZoom / touchState.zoom;
    view.panX = mx - (mx - touchState.px) * realFactor;
    view.panY = my - (my - touchState.py) * realFactor;
    view.zoom = newZoom;
    draw();
    setZoomUI();
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) {
    touchState = null;
  } else if (touchState && touchState.mode === 'pinch' && e.touches.length === 1) {
    touchState = { mode: 'pan', sx: e.touches[0].clientX, sy: e.touches[0].clientY, px: view.panX, py: view.panY };
  }
});

canvas.addEventListener('click', (e) => {
  if (!model) return;
  if (suppressClick) { suppressClick = false; return; }
  const pt = canvasPoint(e);

  // 图例点击：单线路高亮（点击其他线路替换原高亮，再次点击当前线路取消）
  for (const item of legendItems) {
    if (pt.x >= item.x && pt.x <= item.x + item.w && pt.y >= item.y && pt.y <= item.y + item.h) {
      if (highlightLines.has(item.lineId)) highlightLines = new Set();
      else highlightLines = new Set([item.lineId]);
      draw();
      return;
    }
  }

  const t = currentTransform();
  const m = toModel(pt, t);
  const threshold = 26 / t.scale;
  let best = null, bd = Infinity;
  for (const sname of model.stationOrder) {
    const s = model.stations[sname];
    const d = Math.hypot(m.x - s.x, m.y - s.y);
    if (d < threshold && d < bd) { bd = d; best = sname; }
  }
  if (!best) {
    // 点击地图空白背景：取消线路高亮，并清空已选站点 / 选择模式
    const hadAnything = !!(highlightLines.size || ui.start || ui.end || ui.pickMode);
    if (highlightLines.size) highlightLines = new Set();
    if (ui.start || ui.end || ui.pickMode) {
      ui.start = null; ui.end = null; ui.pickMode = null;
      els.fromInput.value = ''; els.toInput.value = '';
      route = null; renderResult(null);
      togglePickButtons();
    }
    if (hadAnything) setStatus('💡 已清空选择的站点', '#7b8a9b');
    draw();
    return;
  }

  if (ui.pickMode === 'start') {
    // 选择起点模式：再点当前起点 → 取消选择
    if (best === ui.start) { ui.start = null; els.fromInput.value = ''; route = null; renderResult(null); setStatus('💡 已取消起点'); }
    else pick('start', best);
    ui.pickMode = null; togglePickButtons(); draw();
  } else if (ui.pickMode === 'end') {
    // 选择终点模式：再点当前终点 → 取消选择
    if (best === ui.end) { ui.end = null; els.toInput.value = ''; route = null; renderResult(null); setStatus('💡 已取消终点'); }
    else pick('end', best);
    ui.pickMode = null; togglePickButtons(); draw();
  } else {
    // 直接点击：按顺序选择
    if (!ui.start) {
      pick('start', best);
    } else if (!ui.end) {
      // 起点已选：再点当前起点 → 取消起点，否则设为终点
      if (best === ui.start) { ui.start = null; els.fromInput.value = ''; route = null; renderResult(null); setStatus('💡 已取消起点'); draw(); }
      else pick('end', best);
    } else {
      // 起点终点都已选：点击已选站点清除，点击其它站点替换起点
      if (best === ui.start) { ui.start = null; els.fromInput.value = ''; route = null; renderResult(null); setStatus('💡 已清除起点'); }
      else if (best === ui.end) { ui.end = null; els.toInput.value = ''; route = null; renderResult(null); setStatus('💡 已清除终点'); }
      else pick('start', best);
      draw();
    }
  }
});

/* ---------- 按钮 ---------- */
els.planBtn.addEventListener('click', planRoute);
els.clearBtn.addEventListener('click', () => {
  ui.start = null; ui.end = null; route = null;
  els.fromInput.value = ''; els.toInput.value = '';
  renderResult(null); draw();
  setStatus('💡 已清空，重新规划');
});
els.resetBtn.addEventListener('click', () => {
  ui.start = null; ui.end = null; route = null;
  els.fromInput.value = ''; els.toInput.value = '';
  els.pickMode = null; togglePickButtons();
  renderResult(null); draw();
  setStatus('🔄 已重置');
});
els.swapBtn.addEventListener('click', () => {
  const s = ui.start; ui.start = ui.end; ui.end = s;
  els.fromInput.value = ui.start || ''; els.toInput.value = ui.end || '';
  draw();
  if (ui.start && ui.end) planRoute();
});
/* 缩放按钮 */
els.zoomInBtn.addEventListener('click', () => { if (model) zoomCenter(1.25); });
els.zoomOutBtn.addEventListener('click', () => { if (model) zoomCenter(1 / 1.25); });
els.zoomResetBtn.addEventListener('click', () => { if (model) resetZoom(); });
function togglePickButtons() {
  els.setStartBtn.classList.toggle('active-mode', ui.pickMode === 'start');
  els.setEndBtn.classList.toggle('active-mode', ui.pickMode === 'end');
  els.setStartBtn.textContent = ui.pickMode === 'start' ? '● 点击地图选起点' : '选择起点';
  els.setEndBtn.textContent = ui.pickMode === 'end' ? '● 点击地图选终点' : '选择终点';
  els.setStartBtn.style.outline = ui.pickMode === 'start' ? '2px solid #16a34a' : 'none';
  els.setEndBtn.style.outline = ui.pickMode === 'end' ? '2px solid #dc2626' : 'none';
}
els.setStartBtn.addEventListener('click', () => {
  ui.pickMode = ui.pickMode === 'start' ? null : 'start';
  togglePickButtons();
  if (ui.pickMode === 'start') setStatus('🔵 请在地图上点击一个站点设为 起点', '#16a34a');
});
els.setEndBtn.addEventListener('click', () => {
  ui.pickMode = ui.pickMode === 'end' ? null : 'end';
  togglePickButtons();
  if (ui.pickMode === 'end') setStatus('🔴 请在地图上点击一个站点设为 终点', '#dc2626');
});

/* ---------- 画布尺寸（DPR 自适应） ---------- */
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  view.w = Math.max(rect.width, 320);
  view.h = Math.max(rect.height, 320);
  view.dpr = dpr;
  canvas.width = Math.round(view.w * dpr);
  canvas.height = Math.round(view.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas.parentElement);

/* ---------- 搜索框初始化 ---------- */
setupSearch(els.fromInput, els.fromDropdown, 'start');
setupSearch(els.toInput, els.toDropdown, 'end');

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'Enter') planRoute();
  if (e.key === 'r' || e.key === 'R') els.resetBtn.click();
  if (e.key === '+' || e.key === '=') { if (model) zoomCenter(1.25); }
  if (e.key === '-' || e.key === '_') { if (model) zoomCenter(1 / 1.25); }
  if (e.key === '0') { if (model) resetZoom(); }
});

/* ---------- ⌘K 命令面板（Cobalt 签名交互） ---------- */
const paletteCommands = [
  { label: '规划路线', hint: 'Enter', run: () => { planRoute(); } },
  { label: '聚焦起点', hint: 'A', run: () => { els.fromInput.focus(); } },
  { label: '聚焦终点', hint: 'B', run: () => { els.toInput.focus(); } },
  { label: '清空选择', hint: '', run: () => { els.clearBtn.click(); } },
  { label: '重置视图', hint: 'R', run: () => { els.resetBtn.click(); } },
  { label: '导入地图文件', hint: '', run: () => { els.importBtn.click(); } }
  // 「通过路径/URL 加载地图」功能当前隐藏，代码保留；需要时取消注释即可恢复
  /* { label: '通过路径/URL 加载地图…', hint: '', run: () => {
    const p = window.prompt('输入地图文件路径或 URL（支持绝对路径、根相对路径、http(s) 链接）：', DEFAULT_MAP_PATH);
    if (p && p.trim()) loadMapFromPath(p.trim());
  } } */
];
let paletteActive = 0;
let paletteFiltered = [];

function renderPaletteList() {
  const q = els.paletteInput.value.trim().toLowerCase();
  paletteFiltered = q
    ? paletteCommands.filter(c => c.label.toLowerCase().includes(q))
    : paletteCommands.slice();
  if (paletteActive >= paletteFiltered.length) paletteActive = 0;
  if (!paletteFiltered.length) {
    els.paletteList.innerHTML = '<div class="palette-empty">没有匹配的命令</div>';
    return;
  }
  els.paletteList.innerHTML = paletteFiltered.map((c, i) =>
    '<div class="palette-item' + (i === paletteActive ? ' active' : '') + '" data-i="' + i + '">' +
    '<span>' + c.label + '</span>' +
    (c.hint ? '<span class="kbd">' + c.hint + '</span>' : '') +
    '</div>'
  ).join('');
}
function openPalette() {
  els.paletteBackdrop.hidden = false;
  els.paletteInput.value = '';
  paletteActive = 0;
  renderPaletteList();
  els.paletteInput.focus();
  document.body.style.overflow = 'hidden';
}
function closePalette() {
  els.paletteBackdrop.hidden = true;
  document.body.style.overflow = '';
}
function runPaletteCommand(i) {
  const cmd = paletteFiltered[i];
  if (!cmd) return;
  closePalette();
  cmd.run();
}
els.paletteBtn.addEventListener('click', openPalette);
els.paletteBackdrop.addEventListener('click', (e) => { if (e.target === els.paletteBackdrop) closePalette(); });
els.paletteInput.addEventListener('input', () => { paletteActive = 0; renderPaletteList(); });
els.paletteInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteActive = (paletteActive + 1) % paletteFiltered.length; renderPaletteList(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteActive = (paletteActive - 1 + paletteFiltered.length) % paletteFiltered.length; renderPaletteList(); }
  else if (e.key === 'Enter') { e.preventDefault(); runPaletteCommand(paletteActive); }
  else if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
});
els.paletteList.addEventListener('click', (e) => {
  const item = e.target.closest('.palette-item');
  if (item) runPaletteCommand(Number(item.dataset.i));
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    if (els.paletteBackdrop.hidden) openPalette(); else closePalette();
  }
});

/* ---------- 滚动显现（reduced-motion 安全） ---------- */
if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); } });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-in'));
}

/* ---------- 启动 ---------- */
// 预计耗时隐藏时，同时隐藏概览卡片中的「预计耗时」项（保留 DOM，便于日后启用）
if (!SHOW_TIME) {
  const timeItem = document.querySelector('.ov-item.time');
  if (timeItem) timeItem.style.display = 'none';
  const grid = document.querySelector('.overview-grid');
  if (grid) grid.style.gridTemplateColumns = 'repeat(2, 1fr)';
}
populateMapSelect();
resize();
})();
</script>
</body>
</html>
